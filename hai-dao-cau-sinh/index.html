<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hải Đảo Cầu Sinh — Homestead</title>
<meta name="description" content="Hải Đảo Cầu Sinh — cozy island survival, màn Homestead.">
<meta name="theme-color" content="#FA8231">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cầu Sinh">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --turquoise:#2BB8A6;
    --turquoise-deep:#1E8C7F;
    --sand:#F4D06F;
    --driftwood:#8B5A2B;
    --driftwood-deep:#6B4423;
    --palm:#4E9F3D;
    --coral:#FA8231;
    --coral-deep:#D9631A;
    --paper:#FFF8E8;
    --paper-deep:#FBEFC9;
    --card:#FFFCF2;
    --ink:#4A2E14;
    --ink-soft:#8A6A45;
    --line:rgba(74,46,20,0.16);
    --shadow:rgba(74,46,20,0.25);
    --cream:#FFFBEF;

    /* theme-controlled tokens — default = day (cosmetic preview only, see settings panel) */
    --scene-sky-a:#BFEDEA;
    --scene-sky-b:#EFE3B0;
    --scene-sand:#F6DE9A;
    --surface:var(--card);
    --surface-border:var(--driftwood);
    --surface-ink:var(--ink);
    --dock-a:var(--driftwood);
    --dock-b:var(--driftwood-deep);
    --dock-btn:#A9762F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper-deep);
    color:var(--ink);
    font-family:"Quicksand",-apple-system,"Segoe UI",sans-serif;
  }
  h1,h2,h3{font-family:"Baloo 2","Segoe UI",sans-serif;margin:0;}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
  button:focus-visible, a:focus-visible{outline:2px solid var(--turquoise-deep);outline-offset:2px;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }

  /* ---------- responsive app shell ---------- */
  .app{
    position:relative;
    width:100%;
    max-width:480px;
    min-height:100dvh;
    margin:0 auto;
    background:var(--paper);
    overflow:hidden;
  }
  @media (min-width:560px){
    body{display:flex;justify-content:center;padding:28px 16px;}
    .app{
      height:min(880px, calc(100dvh - 56px));
      min-height:0;
      border-radius:28px;
      border:1px solid var(--line);
      box-shadow:0 30px 60px var(--shadow);
    }
  }

  .screen{
    position:absolute;inset:0;display:flex;flex-direction:column;
    padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  }
  .screen[hidden]{display:none;}

  /* ---------- settings popover (theme preview + reset, demo aid) ---------- */
  .settings-toggle{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:60;
    width:34px;height:34px;border-radius:50%;background:rgba(255,252,242,.9);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px var(--shadow);
  }
  .settings-toggle svg{width:56%;height:56%;color:var(--ink-soft);}
  .settings-panel{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 48px);right:10px;z-index:60;
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;
    box-shadow:0 12px 26px var(--shadow);display:flex;flex-direction:column;gap:8px;
    opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .15s ease, transform .15s ease;
  }
  .settings-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .settings-panel[hidden]{display:none;}
  .settings-label{font-family:"JetBrains Mono",monospace;font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;}
  .theme-switch{display:flex;gap:4px;background:var(--paper-deep);border-radius:999px;padding:3px;}
  .theme-btn{font-family:"Baloo 2";font-size:0.72rem;font-weight:700;padding:5px 9px;border-radius:999px;color:var(--ink-soft);white-space:nowrap;}
  .theme-btn.active{background:var(--turquoise);color:#fff;}
  .settings-link{font-size:0.72rem;color:var(--ink-soft);text-decoration:underline;white-space:nowrap;text-align:left;}
  .settings-link.danger{color:var(--coral-deep);}

  /* ================= HOMESTEAD HUD ================= */
  .hud-topbar{
    margin:0 10px;flex:0 0 auto;
    background:var(--surface);border:2px solid var(--surface-border);border-radius:18px;
    padding:6px 8px;display:flex;align-items:center;gap:8px;color:var(--surface-ink);
  }
  .hud-avatar{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--turquoise) center/cover no-repeat;border:2px solid var(--cream);overflow:hidden;}
  .hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .hud-mid-row{display:flex;justify-content:space-between;gap:6px;font-size:0.74rem;font-weight:600;}
  .hud-mid-row .talent{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hud-mid-row .day{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stamina-bar{height:8px;border-radius:999px;background:rgba(0,0,0,0.18);overflow:hidden;}
  .stamina-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#BFEFEF,var(--turquoise));transition:width .3s ease;}
  .hud-hp{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--coral-deep);}
  .hud-hp svg{width:16px;height:16px;}
  .hud-hp span{font:700 0.62rem "JetBrains Mono",monospace;color:var(--surface-ink);}

  .resource-bar{flex:0 0 auto;display:flex;gap:6px;margin:7px 10px 0;align-items:stretch;}
  .resource-row{flex:1;display:flex;gap:6px;min-width:0;}
  .res-chip{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card);border:1.5px solid var(--driftwood);border-radius:12px;padding:4px 6px;font-size:0.76rem;font-weight:700;color:var(--ink);position:relative;}
  .res-chip svg{width:16px;height:16px;flex:0 0 auto;}
  .res-chip .gold-chip{color:var(--coral-deep);}
  .res-icon-img{width:18px;height:18px;flex:0 0 auto;object-fit:contain;}
  .weather-badge{flex:0 0 auto;aspect-ratio:1/1;width:34px;background:var(--card);border:1.5px solid var(--driftwood);border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .weather-badge svg{width:60%;height:60%;}

  .viewport{
    flex:1;margin:8px 10px 0;border-radius:12px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--scene-sky-a) 0%,var(--scene-sky-a) 30%,var(--scene-sky-b) 30%,var(--scene-sand) 100%);
  }
  .vp-palm{position:absolute;width:13%;color:var(--palm);opacity:.9;}
  .vp-palm.left{left:3%;top:3%;}
  .vp-palm.right{right:4%;top:5%;transform:scaleX(-1);}
  .vp-plots{position:absolute;left:6%;right:6%;bottom:5%;top:30%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:6%;}
  .plot{
    border:1.5px solid var(--driftwood-deep);border-radius:9px;
    background:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    position:relative;overflow:visible;
  }
  .plot:hover{background:rgba(255,255,255,.55);}
  .plot.ready{animation:readyPulse 1.6s ease-in-out infinite;}
  @keyframes readyPulse{0%,100%{box-shadow:0 0 0 2px var(--coral)}50%{box-shadow:0 0 0 3px var(--coral),0 0 12px rgba(250,130,49,.55)}}
  .plot-art{width:52%;}
  .plot-art svg{width:100%;display:block;overflow:visible;}
  .plot-art.sway{animation:sway 2.4s ease-in-out infinite;transform-origin:bottom center;}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .plot-label{font-size:0.56rem;font-weight:700;color:var(--ink);text-align:center;line-height:1.15;}

  .goal-bar{
    flex:0 0 auto;margin:8px 10px 0;background:var(--surface);border-radius:12px;padding:6px 10px;
    display:flex;align-items:center;gap:7px;color:var(--surface-ink);text-align:left;cursor:pointer;
  }
  .goal-bar:active{filter:brightness(.96);}
  .goal-bar svg{width:16px;height:16px;flex:0 0 auto;color:var(--coral);}
  .goal-text{flex:1;min-width:0;font-size:0.74rem;line-height:1.25;}
  .goal-track{width:44px;height:6px;border-radius:999px;background:rgba(0,0,0,.15);overflow:hidden;flex:0 0 auto;}
  .goal-fill{height:100%;background:var(--coral);border-radius:999px;}
  .goal-chevron{flex:0 0 auto;font-size:1rem;line-height:1;color:var(--ink-soft);}

  .dock{
    flex:0 0 auto;position:relative;margin-top:10px;height:78px;overflow:visible;
    background:linear-gradient(180deg,var(--dock-a),var(--dock-b));
    border-top:2px solid var(--driftwood-deep);
    display:flex;align-items:center;justify-content:space-around;
    padding:0 8px calc(env(safe-area-inset-bottom,0px));
  }
  .dock-btn{width:44px;height:44px;border-radius:50%;background:var(--dock-btn);border:2px solid var(--driftwood-deep);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 4px rgba(0,0,0,.25);position:relative;}
  .dock-btn svg{width:52%;height:52%;color:var(--cream);}
  .dock-btn .badge-dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--driftwood-deep);}
  .dock-cta{
    width:74px;height:74px;margin-top:-34px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#FFAE6B,var(--coral) 60%,var(--coral-deep) 100%);
    border:3px solid var(--cream);box-shadow:0 6px 14px var(--shadow);z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .dock-cta-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .dock-cta small{position:relative;margin-top:auto;margin-bottom:3px;font-size:0.5rem;font-weight:700;color:#fff;background:rgba(74,46,20,.55);padding:1px 6px;border-radius:999px;}
  .dock-cta.locked{opacity:.5;cursor:not-allowed;}
  .dock-cta.shake{animation:shake .3s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---- cosmetic theme preview (unrelated to real game state) ---- */
  .app[data-theme="night"]{
    --scene-sky-a:#1c2733;--scene-sky-b:#2c3440;--scene-sand:#232b35;
    --surface:rgba(233,229,220,0.14);--surface-border:rgba(233,229,220,0.55);--surface-ink:#EDE5D4;
    --dock-a:#232b35;--dock-b:#141a21;--dock-btn:#3a4450;
  }
  .app[data-theme="night"] .screen-homestead{background:#1b232c;}
  .app[data-theme="night"] .res-chip{background:rgba(233,229,220,.1);border-color:rgba(233,229,220,.4);color:#EDE5D4;}
  .app[data-theme="storm"]{ --scene-sky-a:#c7cdc9;--scene-sky-b:#dfe3e0;--scene-sand:#cbc2a8; }

  /* ================= CHOICE (first launch only) ================= */
  .choice-head{flex:0 0 auto;text-align:center;padding:8px 16px;}
  .choice-title{font-size:1.05rem;}
  .choice-sub{font-size:0.78rem;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .choice-grid{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 14px;overflow-y:auto;}
  .choice-card{
    text-align:left;background:var(--card);border:2px solid var(--driftwood);border-radius:14px;
    padding:14px;display:flex;flex-direction:column;gap:5px;
  }
  .choice-card:active{background:var(--paper-deep);}
  .choice-icon{width:26px;height:26px;color:var(--coral);}
  .choice-card h3{font-size:1rem;}
  .choice-card p{font-size:0.8rem;line-height:1.5;color:var(--ink-soft);}
  .choice-effect{font:600 0.68rem "JetBrains Mono",monospace;color:var(--turquoise-deep);}

  /* ================= CHECK-IN ================= */
  .checkin-head{flex:0 0 auto;text-align:center;font-size:0.86rem;font-weight:700;color:var(--ink);padding:2px 10px 8px;}
  .checkin-banner{flex:0 0 auto;width:calc(100% - 20px);margin:0 10px;height:15%;min-height:70px;object-fit:cover;border-radius:10px;}

  .checkin-card{
    flex:1;margin:10px;background:var(--card);border:2px solid var(--driftwood);border-radius:14px;
    padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;overflow-y:auto;
  }
  .checkin-line{font-size:0.86rem;font-weight:600;color:var(--ink);}
  .checkin-chest{width:78px;height:56px;position:relative;transform-origin:bottom center;}
  .checkin-chest.opening{animation:chestOpen .5s ease;}
  @keyframes chestOpen{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.12) rotate(-6deg)}70%{transform:scale(1.05) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
  .checkin-sub{font-size:0.74rem;color:var(--ink-soft);}
  .streak-dots{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap;justify-content:center;}
  .week-chip{display:flex;flex-direction:column;align-items:center;gap:2px;width:36px;padding:4px 2px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper-deep);opacity:.5;}
  .week-chip .res-icon-img{width:16px;height:16px;}
  .week-chip .week-chip-day{font:700 0.56rem "JetBrains Mono",monospace;color:var(--ink-soft);}
  .week-chip.filled{opacity:1;border-color:var(--turquoise);}
  .week-chip.today{opacity:1;border-color:var(--coral);border-width:2px;box-shadow:0 0 0 2px rgba(250,130,49,.18);}
  .week-chip.special{border-color:var(--sand);}
  .week-chip.special.filled,.week-chip.special.today{border-width:2px;box-shadow:0 0 0 2px rgba(244,208,111,.4);}

  .cta-pill{
    flex:0 0 auto;margin:0 10px calc(env(safe-area-inset-bottom,0px) + 12px);height:46px;border-radius:23px;
    background:var(--coral);border:2.5px solid var(--driftwood);color:#fff;
    font-family:"Baloo 2";font-weight:700;font-size:0.9rem;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .cta-pill.secondary{background:var(--card);color:var(--ink);border-color:var(--driftwood);}
  .cta-pill.pulse{animation:pillPulse 1.6s ease-in-out infinite;}
  @keyframes pillPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(250,130,49,.35);}50%{transform:scale(1.035);box-shadow:0 0 0 8px rgba(250,130,49,0);}}

  /* ================= MODALS (combat / inventory / journal / tutorial / reset) ================= */
  .modal-backdrop{
    position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;padding:0;
  }
  .modal-backdrop[hidden]{display:none;}
  .modal{
    position:relative;
    width:100%;max-width:100%;background:var(--card);border-top:2px solid var(--driftwood);
    border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    display:flex;flex-direction:column;gap:12px;max-height:82%;overflow-y:auto;
    box-shadow:0 -10px 30px var(--shadow);
  }
  .modal.center{align-self:center;margin:auto;border-radius:18px;max-width:320px;}
  .modal h3{font-size:1.05rem;}
  .modal-close{position:absolute;top:10px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--paper-deep);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:13px;}

  .battle-row{display:flex;align-items:flex-end;justify-content:space-around;padding:6px 0;}
  .combatant{position:relative;display:flex;flex-direction:column;align-items:center;width:88px;}
  .combatant .art{width:100%;}
  .combatant .art svg{width:100%;display:block;overflow:visible;}
  .combatant.hit-flash{animation:hitFlash .35s ease;}
  .combatant.shake-hurt{animation:shakeHurt .4s ease;}
  @keyframes hitFlash{0%{filter:brightness(1)}30%{filter:brightness(1.7) saturate(1.5)}100%{filter:brightness(1)}}
  @keyframes shakeHurt{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .dmg-float{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font:700 0.85rem "JetBrains Mono",monospace;color:var(--coral-deep);animation:floatNum .8s ease forwards;pointer-events:none;}
  @keyframes floatNum{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-24px);opacity:0}}

  .bar-row{display:flex;align-items:center;gap:8px;font-size:0.74rem;}
  .bar-row>span:first-child{width:38px;color:var(--ink-soft);flex:0 0 auto;}
  .bar{flex:1;height:10px;border-radius:999px;background:var(--paper-deep);overflow:hidden;}
  .bar-fill{height:100%;transition:width .3s ease;}
  .bar-fill.hp{background:var(--coral);}
  .bar-fill.enemy{background:#8a5a34;}
  .bar-num{font:700 0.7rem "JetBrains Mono",monospace;width:44px;text-align:right;flex:0 0 auto;}
  .combat-log{background:var(--paper-deep);border-radius:8px;padding:8px 10px;font-size:0.78rem;display:flex;flex-direction:column;gap:4px;min-height:30px;}
  .modal-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .m-btn{flex:1;min-width:96px;height:44px;border-radius:12px;font-weight:700;font-size:0.82rem;display:flex;align-items:center;justify-content:center;gap:6px;}
  .m-btn.primary{background:var(--coral);color:#fff;border:2px solid var(--coral-deep);}
  .m-btn.secondary{background:var(--turquoise);color:#fff;border:2px solid var(--turquoise-deep);}
  .m-btn.ghost{background:var(--paper-deep);color:var(--ink);border:2px solid var(--line);}

  .market-banner{width:100%;height:64px;object-fit:cover;border-radius:12px;margin-top:-2px;}

  .item-row{display:flex;gap:8px;flex-wrap:wrap;}
  .item-chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper-deep);border-radius:10px;padding:8px 10px;min-width:64px;flex:1;}
  .item-chip svg{width:26px;height:26px;}
  .item-count{font:700 0.78rem "JetBrains Mono",monospace;}
  .muted{color:var(--ink-soft);font-size:0.8rem;}

  /* ---- order board ---- */
  .order-list{display:flex;flex-direction:column;gap:10px;}
  .order-card{background:var(--paper-deep);border:2px solid var(--driftwood);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
  .order-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .order-req-chip{display:flex;align-items:center;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 9px;font-size:0.76rem;font-weight:700;color:var(--ink);}
  .order-req-chip.short{border-color:var(--coral);color:var(--coral-deep);}
  .order-arrow{color:var(--ink-soft);font-weight:700;flex:0 0 auto;}
  .order-reward-chip{display:flex;align-items:center;gap:4px;font-size:0.8rem;font-weight:700;color:var(--coral-deep);margin-left:auto;}
  .order-hint{font-size:0.7rem;color:var(--coral-deep);}
  .order-complete{animation:orderComplete .32s ease forwards;}
  @keyframes orderComplete{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(.92);}}

  /* ---- balo tabs + island market (Pearls) ---- */
  .modal-header-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pearl-balance{display:flex;align-items:center;gap:4px;font:700 0.82rem "JetBrains Mono",monospace;color:var(--ink);background:var(--paper-deep);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;flex:0 0 auto;}
  .tab-row{display:flex;gap:6px;background:var(--paper-deep);border-radius:999px;padding:3px;}
  .tab-btn{flex:1;text-align:center;padding:7px 0;border-radius:999px;font:700 0.8rem "Baloo 2";color:var(--ink-soft);}
  .tab-btn.active{background:var(--turquoise);color:#fff;}
  .market-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .market-card{background:var(--paper-deep);border:2px solid var(--driftwood);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;}
  .market-card-icon{width:30px;height:30px;}
  .market-card-icon .res-icon-img{width:28px;height:28px;}
  .market-card-name{font:700 0.76rem "Baloo 2";color:var(--ink);line-height:1.2;min-height:2.1em;}
  .market-card-price{display:flex;align-items:center;gap:3px;font:700 0.74rem "JetBrains Mono",monospace;color:var(--coral-deep);}
  .market-card-owned{font-size:0.66rem;color:var(--turquoise-deep);font-weight:700;}
  .market-card.unowned{opacity:.5;}
  .craft-card-head{display:flex;align-items:center;gap:8px;font:700 0.86rem "Baloo 2";color:var(--ink);}
  .collection-group-label{font:700 0.82rem "Baloo 2";color:var(--ink);margin:2px 0 -2px;}
  .pet-lock-row{display:flex;align-items:center;justify-content:center;gap:4px;}
  .pet-lock-label{font-size:0.64rem;color:var(--ink-soft);font-weight:700;}

  .journal-line{font-size:0.82rem;line-height:1.5;font-style:italic;}
  .journal-line.muted{color:var(--ink-soft);font-style:normal;}
  .journal-day{font-style:normal;font:700 0.7rem "JetBrains Mono",monospace;color:var(--ink-soft);margin-right:4px;}
  .journal-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;background:var(--paper-deep);border-radius:10px;padding:10px;}

  /* ---- onboarding coachmarks (first launch only) ---- */
  #tut-overlay{position:absolute;inset:0;z-index:70;}
  .tut-highlight{
    position:absolute;border-radius:14px;border:2.5px solid var(--coral);
    box-shadow:0 0 0 9999px rgba(20,14,8,.62);
    transition:left .25s ease, top .25s ease, width .25s ease, height .25s ease;
    pointer-events:none;
  }
  .tut-highlight[hidden]{display:none;}
  .tut-card{
    position:absolute;left:14px;right:14px;
    background:var(--card);border:2px solid var(--driftwood);border-radius:14px;
    padding:12px 14px;box-shadow:0 10px 24px var(--shadow);
    display:flex;flex-direction:column;gap:8px;
    transition:top .25s ease;
  }
  .tut-step-label{font:700 0.62rem "JetBrains Mono",monospace;letter-spacing:0.08em;text-transform:uppercase;color:var(--coral-deep);}
  .tut-text{font-size:0.86rem;line-height:1.5;color:var(--ink);margin:0;}
  .tut-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .tut-skip{font-size:0.78rem;color:var(--ink-soft);text-decoration:underline;background:none;border:none;padding:4px;cursor:pointer;}
  .tut-next{flex:0 0 auto;min-width:110px;}
  .gender-pick-row{display:flex;gap:10px;}
  .gender-pick{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:14px;border:2px solid var(--driftwood);background:var(--card);}
  .gender-pick:active{background:var(--paper-deep);}
  .gender-pick img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;}
  .gender-pick span{font:700 0.84rem "Baloo 2";color:var(--ink);}

  #toast{
    position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);
    background:var(--ink);color:var(--cream);padding:9px 16px;border-radius:999px;font-size:0.82rem;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:90;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app" id="app" data-theme="day">
  <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Tuỳ chọn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
  <div class="settings-panel" id="settings-panel" hidden>
    <span class="settings-label">Xem thử theme (chỉ đổi màu)</span>
    <div class="theme-switch" role="group" aria-label="Chọn theme thời tiết/thời gian">
      <button class="theme-btn active" data-theme-btn="day" type="button">☀ Ngày</button>
      <button class="theme-btn" data-theme-btn="night" type="button">☾ Đêm</button>
      <button class="theme-btn" data-theme-btn="storm" type="button">⛈ Bão</button>
    </div>
    <button class="settings-link danger" id="btn-reset" type="button">⟲ Chơi lại từ đầu (xoá tiến trình)</button>
  </div>

  <!-- ============== CHOICE SCREEN (first launch only) ============== -->
  <section class="screen screen-choice" id="screen-choice" hidden>
    <div class="choice-head">
      <div class="choice-title">Ngày 1. Con tàu đã đắm.</div>
      <div class="choice-sub">Bạn dạt vào một hòn đảo không tên. Việc đầu tiên bạn làm hôm nay sẽ định hình bản năng sinh tồn của mình.</div>
    </div>
    <div class="choice-grid">
      <button class="choice-card" id="choice-farmer" type="button">
        <span class="choice-icon" id="choice-farmer-icon"></span>
        <h3>Vỡ đất tìm giống</h3>
        <p>Bạn lục tìm trong khoang tàu vỡ, nhặt được vài hạt giống còn sót. Bàn tay quen với đất đai.</p>
        <span class="choice-effect">Thiên Phú Nông Dân · trồng trọt không tốn sức · +2 sức tối đa</span>
      </button>
      <button class="choice-card" id="choice-warrior" type="button">
        <span class="choice-icon" id="choice-warrior-icon"></span>
        <h3>Mài vũ khí tự vệ</h3>
        <p>Bạn nhặt mảnh gỗ vỡ, mài thành thanh kiếm thô sơ. Bản năng chiến đấu trỗi dậy.</p>
        <span class="choice-effect">Thiên Phú Chiến Binh · ra khơi tốn ít sức hơn · +2 máu tối đa</span>
      </button>
    </div>
  </section>

  <!-- ============== CHECK-IN SCREEN ============== -->
  <section class="screen screen-checkin" id="screen-checkin" hidden>
    <div class="checkin-head" id="checkin-daylabel">Ngày 1 · Bình minh</div>
    <img class="checkin-banner" src="assets/ui/ui-modal-daily-bonus-banner.jpg" alt="">
    <div class="checkin-card">
      <p class="checkin-line" id="checkin-line">Sóng đêm dạt vào 1 chiếc rương</p>
      <div class="checkin-chest" id="checkin-chest">
        <svg viewBox="0 0 78 56" fill="none">
          <rect x="4" y="26" width="70" height="26" rx="4" fill="#8B5A2B" stroke="#4A2E14" stroke-width="2"/>
          <path d="M4 28c0-12 15-20 35-20s35 8 35 20" fill="#A9762F" stroke="#4A2E14" stroke-width="2"/>
          <rect x="33" y="24" width="12" height="10" rx="2" fill="#F4D06F" stroke="#4A2E14" stroke-width="1.6"/>
        </svg>
      </div>
      <p class="checkin-sub" id="checkin-sub">Chạm để mở — phần thưởng ngày 1</p>
      <div class="streak-dots" id="streak-dots" aria-hidden="true"></div>
    </div>
    <button class="cta-pill pulse" id="btn-open-chest" type="button">Nhận quà</button>
  </section>

  <!-- ============== HOMESTEAD SCREEN ============== -->
  <section class="screen screen-homestead" id="screen-homestead" hidden>
    <div class="hud-topbar">
      <div class="hud-avatar" id="hud-avatar"></div>
      <div class="hud-mid">
        <div class="hud-mid-row"><span class="talent" id="hud-talent-label">—</span><span class="day" id="hud-day-label">Ngày 1</span></div>
        <div class="stamina-bar"><div class="stamina-fill" id="hud-energy-fill" style="width:100%"></div></div>
      </div>
      <div class="hud-hp">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.7-10-9.4C.3 7.6 2 4 5.6 4c2 0 3.4 1 4.4 2.5C11 5 12.4 4 14.4 4 18 4 19.7 7.6 18 11.1 15.5 15.8 12 20.5 12 20.5Z"/></svg>
        <span id="hud-hp-label">10/10</span>
      </div>
    </div>

    <div class="resource-bar">
      <div class="resource-row" id="resource-row"></div>
      <div class="weather-badge" id="weather-badge" title="Thời tiết"></div>
    </div>

    <div class="viewport" id="viewport">
      <svg class="vp-palm left" viewBox="0 0 60 80" fill="none"><path d="M32 78c0-24 2-40 6-52" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M38 26c-10-6-20-6-28-2 8 8 18 9 28 2Z" fill="currentColor"/><path d="M38 26c-4-10-2-18 4-24 6 8 6 17 -4 24Z" fill="currentColor"/><path d="M38 26c10-6 20-6 28-2-8 8-18 9-28 2Z" fill="currentColor"/></svg>
      <svg class="vp-palm right" viewBox="0 0 60 80" fill="none"><path d="M32 78c0-24 2-40 6-52" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M38 26c-10-6-20-6-28-2 8 8 18 9 28 2Z" fill="currentColor"/><path d="M38 26c-4-10-2-18 4-24 6 8 6 17 -4 24Z" fill="currentColor"/><path d="M38 26c10-6 20-6 28-2-8 8-18 9-28 2Z" fill="currentColor"/></svg>
      <div class="vp-plots" id="vp-plots"></div>
    </div>

    <button class="goal-bar" id="goal-bar" type="button" title="Bảng đơn hàng đảo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 15h18l-2.5 5h-13L3 15Z" fill="currentColor" stroke="none"/><path d="M12 3v10M12 5l5 3-5 2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span class="goal-text" id="goal-text">Tích vàng đóng bè · 0/50</span>
      <div class="goal-track"><div class="goal-fill" id="goal-fill" style="width:0%"></div></div>
      <span class="goal-chevron" aria-hidden="true">›</span>
    </button>

    <div class="dock">
      <button class="dock-btn" id="btn-backpack" title="Balo / Kho" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="8" width="14" height="13" rx="3"/><rect x="8" y="4" width="8" height="6" rx="2"/></svg>
        <span class="badge-dot" id="backpack-badge" hidden></span>
      </button>
      <button class="dock-btn" id="btn-craft" title="Chế tạo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 4l6 6-3 3-6-6Z" fill="currentColor" stroke="none"/><path d="M12.5 8.5 4 17l3 3 8.5-8.5"/></svg></button>
      <button class="dock-cta" id="cta-sail" title="Ra Khơi" type="button">
        <img class="dock-cta-art" src="assets/ui/ui-hud-cta-ra-khoi-crop.jpg" alt="Ra Khơi">
        <small id="cta-cost">−2 sức</small>
      </button>
      <button class="dock-btn" id="btn-journal" title="Sổ tay / Nhật ký" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="14" height="17" rx="2"/><line x1="8" y1="9" x2="16" y2="9" stroke="#8B5A2B" stroke-width="1.4"/><line x1="8" y1="13" x2="16" y2="13" stroke="#8B5A2B" stroke-width="1.4"/></svg></button>
      <button class="dock-btn" id="btn-friends" title="Hải âu đưa thư / Bạn bè" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 14c4-6 8-2 10 0 2-2 6-6 10 0-5 1-7 4-10 7-3-3-5-6-10-7Z"/></svg></button>
    </div>
  </section>

  <div class="modal-backdrop" id="modal-root" hidden></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var SAVE_KEY = "hdcs_homestead_v1";

  /* ---------------- icons (reused across screens) ---------------- */
  var ICONS = {
    sword: '<svg viewBox="0 0 24 24" fill="none"><path d="M14 3 21 10l-2 2-7-7 2-2Z" fill="currentColor"/><path d="M12.5 11.5 4 20l-1.5-1.5L11 10l1.5 1.5Z" fill="currentColor"/><path d="M2 22l2.5-2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3Z"/></svg>',
    boat: '<svg viewBox="0 0 24 24" fill="none"><path d="M3 15h18l-2.5 5h-13L3 15Z" fill="currentColor"/><path d="M12 3v10M12 5l5 3-5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
  };

  function svg(vb, inner){ return '<svg viewBox="' + vb + '" fill="none">' + inner + '</svg>'; }
  function artTileEmpty(){ return svg('0 0 60 60', '<ellipse cx="30" cy="44" rx="22" ry="8" fill="#5c3a20"/><circle cx="20" cy="42" r="2" fill="#3f2814"/><circle cx="33" cy="46" r="2.2" fill="#3f2814"/><circle cx="41" cy="41" r="1.6" fill="#3f2814"/>'); }
  function artTileTilled(){ return svg('0 0 60 60', '<ellipse cx="30" cy="44" rx="24" ry="9" fill="#6b4423"/><path d="M9 40q21-8 42 0M9 45q21-8 42 0M9 50q21-6 42 0" stroke="#4a2f18" stroke-width="2" stroke-linecap="round" fill="none"/>'); }
  function artTilePlanted(){ return svg('0 0 60 60', '<ellipse cx="30" cy="46" rx="20" ry="7" fill="#6b4423"/><path d="M30 46V32" stroke="#3f7a3a" stroke-width="3" stroke-linecap="round"/><path d="M30 34c0-6-7-9-13-9 1 7 6 11 13 9Z" fill="#4f8f46"/><path d="M30 34c0-6 7-9 13-9-1 7-6 11-13 9Z" fill="#5fa64f"/>'); }
  function artTileReady(){ return svg('0 0 60 60', '<ellipse cx="30" cy="47" rx="20" ry="7" fill="#6b4423"/><path d="M30 47V26" stroke="#3f7a3a" stroke-width="3" stroke-linecap="round"/><path d="M30 30c0-7-8-10-15-10 1 8 7 12 15 10Z" fill="#4f8f46"/><path d="M30 30c0-7 8-10 15-10-1 8-7 12-15 10Z" fill="#5fa64f"/><path d="M25 42c0-6 2-11 5-14 3 3 5 8 5 14 0 4-2 6-5 6s-5-2-5-6Z" fill="#e08a2e"/><circle cx="45" cy="16" r="2" fill="#f4c862"/><path d="M45 12v2M45 18v2M41 16h2M47 16h2" stroke="#f4c862" stroke-width="1.4" stroke-linecap="round"/>'); }
  var TILE_ART = [artTileEmpty, artTileTilled, artTilePlanted, artTileReady];
  var STAGE_META = [
    { label:'Đất trống', hint:function(){ return 'Chạm để khai hoang'; }, sway:false },
    { label:'Đã khai hoang', hint:function(){ return 'Chạm để gieo hạt'; }, sway:false },
    { label:'Đang lớn', hint:function(t){ return t.watered ? 'Đã tưới hôm nay' : 'Chạm để tưới nước'; }, sway:true },
    { label:'Sẵn sàng!', hint:function(){ return 'Chạm để thu hoạch'; }, sway:true }
  ];

  function artCharacter(talent){
    var tunic = talent === 'warrior' ? '#8a5a34' : '#5c9a4b';
    var hat = talent === 'warrior'
      ? '<path d="M11 12c2-5 6-7 9-7s7 2 9 7" fill="none" stroke="#b84f28" stroke-width="4" stroke-linecap="round"/>'
      : '<ellipse cx="20" cy="8" rx="12" ry="3" fill="#d9a441"/><path d="M11 8c1-5 5-8 9-8s8 3 9 8c-6 2-12 2-18 0Z" fill="#e8bd63"/>';
    return svg('0 0 40 52', '<circle cx="20" cy="16" r="9" fill="#f0c49a"/>' + hat +
      '<rect x="10" y="24" width="20" height="17" rx="6" fill="' + tunic + '"/>' +
      '<rect x="7" y="40" width="8" height="10" rx="3" fill="#4a3323"/><rect x="25" y="40" width="8" height="10" rx="3" fill="#4a3323"/>');
  }
  var MONSTER_ART = {
    'Heo Rừng': function(){ return svg('0 0 70 60', '<ellipse cx="34" cy="36" rx="24" ry="17" fill="#8a5a34"/><ellipse cx="34" cy="42" rx="16" ry="9" fill="#c9a06c"/><ellipse cx="14" cy="30" rx="6" ry="5" fill="#8a5a34"/><circle cx="16" cy="28" r="1.6" fill="#2b241d"/>'); },
    'Cua Khổng Lồ': function(){ return svg('0 0 70 60', '<ellipse cx="35" cy="34" rx="22" ry="15" fill="#c1512c"/><circle cx="27" cy="30" r="2.4" fill="#2b241d"/><circle cx="43" cy="30" r="2.4" fill="#2b241d"/><path d="M8 26c-6-4-10 2-6 7" stroke="#e07a4c" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M62 26c6-4 10 2 6 7" stroke="#e07a4c" stroke-width="5" stroke-linecap="round" fill="none"/>'); },
    'Sói Đảo': function(){ return svg('0 0 70 60', '<ellipse cx="35" cy="36" rx="22" ry="15" fill="#74777c"/><path d="M18 24l-4-9 9 5Z" fill="#74777c"/><path d="M52 24l4-9-9 5Z" fill="#74777c"/><ellipse cx="35" cy="42" rx="13" ry="7" fill="#a3a6ab"/><circle cx="26" cy="32" r="2" fill="#e8c56e"/><circle cx="44" cy="32" r="2" fill="#e8c56e"/>'); }
  };
  function artMonster(name){ return (MONSTER_ART[name] || MONSTER_ART['Heo Rừng'])(); }
  function artCrop(){ return svg('0 0 24 24', '<path d="M12 21V9" stroke="#3f7a3a" stroke-width="2" stroke-linecap="round"/><path d="M12 12c0-5-4-7-8-7 1 5 4 8 8 7Z" fill="#4f8f46"/><path d="M12 12c0-5 4-7 8-7-1 5-4 8-8 7Z" fill="#5fa64f"/><path d="M8 18c0-3 1.5-6 4-8 2.5 2 4 5 4 8 0 2.5-1.8 4-4 4s-4-1.5-4-4Z" fill="#e08a2e"/>'); }
  function artMeat(){ return svg('0 0 24 24', '<path d="M9 3c5 0 9 4 9 9 0 4-3 7-6 8l-3 3-2-2 2-3c-2-1-3-3-3-6 0-5 1-9 3-9Z" fill="#a85c3c"/><circle cx="6" cy="19" r="2" fill="#e9d9b0"/>'); }
  function artWood(){ return svg('0 0 24 24', '<rect x="2" y="8" width="20" height="8" rx="4" fill="#8a5a34"/><ellipse cx="4.5" cy="12" rx="2.5" ry="4" fill="#c9a06c"/><ellipse cx="19.5" cy="12" rx="2.5" ry="4" fill="#c9a06c"/>'); }
  // Pearls has no source art (unlike crop/meat/wood/gold); this is the one simple glyph the
  // spec allows adding, kept to the existing palette (soft lavender-white, driftwood outline).
  function artPearl(){ return svg('0 0 24 24', '<circle cx="12" cy="12" r="9" fill="#E7E0F0" stroke="#8A6A45" stroke-width="1.3"/><ellipse cx="9" cy="8.6" rx="2.4" ry="1.6" fill="#ffffff" opacity="0.85"/>'); }
  var ITEM_ART = { crop: artCrop, meat: artMeat, wood: artWood, pearl: artPearl };

  // Animal sanctuary preview (Chapter 2, not yet unlockable) — flat gray-stone silhouettes,
  // since none of these pets have any existing art and every card here is locked anyway.
  function artLock(){ return svg('0 0 24 24', '<rect x="5" y="11" width="14" height="10" rx="2.5" fill="#9C948A" stroke="#6B6259" stroke-width="1.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#6B6259" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="15.5" r="1.6" fill="#6B6259"/>'); }
  function artChick(){ return svg('0 0 24 24', '<ellipse cx="12" cy="14" rx="7" ry="6" fill="#B9AFA0"/><circle cx="12" cy="7" r="4" fill="#B9AFA0"/><path d="M12 7l3.4 1.3-3.4 1Z" fill="#8F8575"/>'); }
  function artCow(){ return svg('0 0 24 24', '<ellipse cx="12" cy="14" rx="8" ry="6" fill="#B9AFA0"/><circle cx="7" cy="8" r="2.4" fill="#B9AFA0"/><circle cx="17" cy="8" r="2.4" fill="#B9AFA0"/><ellipse cx="9" cy="15" rx="1.6" ry="1.2" fill="#8F8575"/><ellipse cx="15" cy="12" rx="1.3" ry="1" fill="#8F8575"/>'); }

  var ORDER_TEMPLATES = [
    { id:'ord_crop_1',  requires:[{ resource:'crop', qty:3 }],                          reward:{ resource:'gold', qty:12 }, minDay:1 },
    { id:'ord_wood_1',  requires:[{ resource:'wood', qty:2 }],                          reward:{ resource:'gold', qty:8 },  minDay:1 },
    { id:'ord_meat_1',  requires:[{ resource:'meat', qty:2 }],                          reward:{ resource:'gold', qty:12 }, minDay:2 },
    { id:'ord_mixed_1', requires:[{ resource:'crop', qty:4 }, { resource:'wood', qty:1 }], reward:{ resource:'gold', qty:20 }, minDay:2 },
    { id:'ord_crop_2',  requires:[{ resource:'crop', qty:6 }],                          reward:{ resource:'gold', qty:24 }, minDay:3 }
  ];
  var MAX_ORDERS = 3;
  var ORDER_REFILL_DELAY = 2; // days between a delivered order and a new one appearing — avoids a grindy always-full board
  var ORDER_RES_LABEL = { crop:'nông sản', meat:'thịt', wood:'gỗ trôi dạt', gold:'vàng', pearl:'Pearl' };

  /* ---------------- daily check-in reward schedule ----------------
     7 fixed slots keyed by (day-1)%7, the same streak position the
     existing dot/chip row already computes — the streak counting itself
     is untouched. Days 2/3/5 hand over exactly the quantity an order
     board template asks for (2 wood = ord_wood_1, 3 crop = ord_crop_1,
     2 meat = ord_meat_1) so claiming nudges the player back to the
     board with something to deliver immediately. Gold days sit in the
     10-16 range the old flat 10-15 reward used. Day 7 bundles gold +
     wood + crop for clearly the biggest total value of the week — the
     "special gold-bordered card" from the spec — still no new currency. */
  var WEEKLY_REWARDS = [
    { gold: 10 },
    { wood: 2 },
    { crop: 3 },
    { gold: 14 },
    { meat: 2 },
    { gold: 16 },

  ];
  function applyReward(reward){
    Object.keys(reward).forEach(function(k){
      if(k === 'gold') state.gold += reward[k];
      else state.inv[k] = (state.inv[k] || 0) + reward[k];
    });
  }
  function rewardText(reward){
    return Object.keys(reward).map(function(k){ return '+' + reward[k] + ' ' + ORDER_RES_LABEL[k]; }).join(', ');
  }

  function orderResourceIcon(resource){
    if(resource === 'gold') return '<img class="res-icon-img" src="assets/ui/ui-hud-resource-chips-coin.png" alt="">';
    return '<svg viewBox="0 0 24 24" class="res-icon-img">' + ITEM_ART[resource]() + '</svg>';
  }
  function eligibleOrderTemplates(day, excludeIds){
    return ORDER_TEMPLATES.filter(function(t){ return t.minDay <= day && excludeIds.indexOf(t.id) === -1; });
  }
  function instantiateOrder(tpl){
    return { id: tpl.id + '_' + Date.now() + '_' + rand(0, 999), templateId: tpl.id, requires: tpl.requires, reward: tpl.reward };
  }
  function seedInitialOrders(day){
    return eligibleOrderTemplates(day, []).slice(0, MAX_ORDERS).map(instantiateOrder);
  }
  function refillOrders(){
    if(state.orders.length >= MAX_ORDERS || state.day < state.nextOrderRefillDay) return;
    var activeTemplateIds = state.orders.map(function(o){ return o.templateId; });
    var pool = eligibleOrderTemplates(state.day, activeTemplateIds);
    if(!pool.length) pool = eligibleOrderTemplates(state.day, []); // every eligible template already on the board — allow a repeat
    if(!pool.length) return;
    state.orders.push(instantiateOrder(pool[rand(0, pool.length - 1)]));
    state.nextOrderRefillDay = state.day + ORDER_REFILL_DELAY;
  }
  // shared by order delivery and crafting — both just check/spend a [{resource,qty}] list
  function hasEnoughResources(reqs){
    return reqs.every(function(r){ return (state.inv[r.resource] || 0) >= r.qty; });
  }
  function missingResourcesText(reqs){
    return reqs
      .filter(function(r){ return (state.inv[r.resource] || 0) < r.qty; })
      .map(function(r){ return (r.qty - (state.inv[r.resource] || 0)) + ' ' + ORDER_RES_LABEL[r.resource]; })
      .join(', ');
  }
  function orderHasEnough(order){ return hasEnoughResources(order.requires); }
  function orderMissingText(order){ return missingResourcesText(order.requires); }

  /* ---------------- Pearls + island market decorations ----------------

     (every ORDERS_PER_PEARL-th successful delivery) and spendable only on
     decorations here — never mixed with gold/wood/crop/meat or any other
     system. Prices are derived from that source, not guessed: a delivered
     order needs a fresh board slot, and refillOrders() only opens one new
     slot every ORDER_REFILL_DELAY (2) days, so a player delivering as fast
     as the board restocks nets at most ~7/2 = 3.5 orders/week, i.e.
     ~3.5/ORDERS_PER_PEARL ≈ 1.17 Pearls/week. At that rate the 1-Pearl item

  }

  /* ---------------- homestead: farm tiles ---------------- */
  function renderFarm(){
    var html = '';
    state.farm.forEach(function(t, i){
      var meta = STAGE_META[t.stage];
      var readyCls = t.stage === 3 ? ' ready' : '';
      var swayCls = meta.sway ? ' sway' : '';
      html += '<button class="plot' + readyCls + '" data-tile="' + i + '" type="button">' +
        '<span class="plot-art' + swayCls + '">' + TILE_ART[t.stage]() + '</span>' +
        '<span class="plot-label">' + meta.hint(t) + '</span>' +
      '</button>';
    });
    document.getElementById('vp-plots').innerHTML = html;
    document.querySelectorAll('.plot').forEach(function(el){
      el.addEventListener('click', function(){ tileAction(parseInt(el.getAttribute('data-tile'), 10)); });
    });
  }
  function tileAction(i){
    if(state.encounter) return;
    var t = state.farm[i];
    var cost = farmCost();
    if(t.stage === 2 && t.watered){ toast('Ô đất này đã được tưới hôm nay.'); return; }
    if(state.energy < cost){
      var msgs = ['khai hoang','gieo hạt','tưới nước','thu hoạch'];
      toast('Không đủ sức để ' + msgs[t.stage] + '. Hãy nghỉ ngơi qua ngày.');
      return;
    }
    if(t.stage === 0){
      state.energy -= cost; t.stage = 1; addLog('Bạn đã khai hoang một ô đất.');
    } else if(t.stage === 1){
      state.energy -= cost; t.stage = 2; t.watered = false; addLog('Bạn đã gieo hạt giống xuống đất.');
    } else if(t.stage === 2){
      state.energy -= cost; t.watered = true; addLog('Bạn đã tưới nước cho mầm cây.');
    } else if(t.stage === 3){
      state.energy -= cost;
      var y = 1 + (state.talent === 'farmer' ? 1 : 0) + (t.watered ? 1 : 0);
      state.inv.crop += y;
      addLog('Bạn đã thu hoạch ' + y + ' phần nông sản.');
      t.stage = 0; t.watered = false;
    }
    save(); renderAll(); checkGoal();
  }

  /* ---------------- explore / combat ---------------- */
  function explore(){
    if(state.encounter) return;
    var cost = exploreCost();
    if(state.energy < cost){
      var cta = document.getElementById('cta-sail');
      cta.classList.remove('shake'); void cta.offsetWidth; cta.classList.add('shake');
      toast('Không đủ sức để ra khơi khám phá. Hãy nghỉ ngơi qua ngày.');
      return;
    }
    state.energy -= cost;
    var pool = state.day >= 3 ? MONSTERS : MONSTERS.slice(0, 2);
    var m = pool[Math.floor(Math.random() * pool.length)];
    state.encounter = { name:m.name, hp:m.hp, maxHp:m.hp, dmg:m.dmg, reward:m.reward, log:['Một ' + m.name + ' xuất hiện trước mặt bạn!'] };
    save(); renderHud();
    openModal(encounterTemplate());
    bindCombat();
  }
  document.getElementById('cta-sail').addEventListener('click', explore);

  function encounterTemplate(){
    var e = state.encounter;
    var eHp = Math.round(e.hp / e.maxHp * 100);
    var pHp = Math.round(state.hp / maxHp() * 100);
    return '<div class="modal center" id="combat-modal">' +
      '<h3>' + escapeHtml(e.name) + ' xuất hiện!</h3>' +
      '<div class="battle-row">' +
        '<div class="combatant" id="combat-char"><span class="art">' + artCharacter(state.talent) + '</span></div>' +
        '<div class="combatant" id="combat-mon"><span class="art">' + artMonster(e.name) + '</span></div>' +
      '</div>' +
      '<div class="bar-row"><span>Địch</span><div class="bar"><div class="bar-fill enemy" id="bar-enemy" style="width:' + eHp + '%"></div></div><span class="bar-num">' + e.hp + '/' + e.maxHp + '</span></div>' +
      '<div class="bar-row"><span>Bạn</span><div class="bar"><div class="bar-fill hp" id="bar-player" style="width:' + pHp + '%"></div></div><span class="bar-num">' + state.hp + '/' + maxHp() + '</span></div>' +
      '<div class="combat-log" id="combat-log">' + e.log.slice(0,3).map(function(l){ return '<p>' + escapeHtml(l) + '</p>'; }).join('') + '</div>' +
      '<div class="modal-actions">' +
        '<button class="m-btn primary" id="btn-attack" type="button">Tấn công</button>' +
        '<button class="m-btn secondary" id="btn-defend" type="button">Phòng thủ</button>' +
        '<button class="m-btn ghost" id="btn-flee" type="button">Bỏ chạy</button>' +
      '</div></div>';
  }
  function bindCombat(){
    var atk = document.getElementById('btn-attack');
    var def = document.getElementById('btn-defend');
    var flee = document.getElementById('btn-flee');
    if(!atk) return;
    atk.addEventListener('click', combatAttack);
    def.addEventListener('click', combatDefend);
    flee.addEventListener('click', combatFlee);
  }
  function refreshCombatModal(){
    if(!state.encounter){ closeModal(); renderAll(); return; }
    openModal(encounterTemplate());
    bindCombat();
  }
  function monsterTurn(defended){
    var e = state.encounter;
    var dmg = rand(e.dmg[0], e.dmg[1]);
    if(state.talent === 'warrior') dmg = Math.max(0, dmg - 1);
    if(defended) dmg = Math.floor(dmg / 2);
    state.hp = Math.max(0, state.hp - dmg);
    e.log.unshift(e.name + ' phản đòn, bạn mất ' + dmg + ' máu.');
    if(state.hp <= 0){ resolveDefeat(); } else { save(); refreshCombatModal(); }
  }
  function combatAttack(){
    var e = state.encounter; if(!e) return;
    var dmg = state.talent === 'warrior' ? rand(3,5) : rand(1,3);
    e.hp = Math.max(0, e.hp - dmg);
    e.log.unshift('Bạn đã tấn công, gây ' + dmg + ' sát thương.');
    if(e.hp <= 0){ resolveVictory(); } else { monsterTurn(false); }
  }
  function combatDefend(){
    var e = state.encounter; if(!e) return;
    e.log.unshift('Bạn đã thủ thế, chuẩn bị đỡ đòn.');
    monsterTurn(true);
  }
  function combatFlee(){
    var e = state.encounter; if(!e) return;
    addLog('Bạn đã bỏ chạy khỏi ' + e.name + '.');
    state.encounter = null;
    save(); closeModal(); renderAll();
  }
  function resolveVictory(){
    var e = state.encounter;
    var g = rand(e.reward.gold[0], e.reward.gold[1]);
    state.gold += g;
    var extra = '';
    if(e.reward.meat){ var m = rand(e.reward.meat[0], e.reward.meat[1]); if(m>0){ state.inv.meat += m; extra += ', ' + m + ' thịt'; } }
    if(e.reward.wood){ var w = rand(e.reward.wood[0], e.reward.wood[1]); if(w>0){ state.inv.wood += w; extra += ', ' + w + ' gỗ'; } }
    addLog('Bạn đã hạ gục ' + e.name + '! Nhận được ' + g + ' vàng' + extra + '.');
    state.encounter = null;
    save(); closeModal(); renderAll(); checkGoal();
    toast('Chiến thắng! +' + g + ' vàng' + extra + '.');
  }
  function resolveDefeat(){
    var e = state.encounter;
    var lost = Math.floor(state.gold / 2);
    state.gold -= lost;
    state.hp = 1;
    addLog('Bạn đã ngất xỉu trước ' + e.name + ' và đánh rơi ' + lost + ' vàng khi tháo chạy về trại.');
    state.encounter = null;
    save(); closeModal(); renderAll();
    toast('Bạn đã ngất xỉu và mất ' + lost + ' vàng — được đưa về trại.');
  }

  /* ---------------- backpack: sell tab + island market tab ---------------- */
  var backpackTab = 'sell';
  document.getElementById('btn-backpack').addEventListener('click', function(){ backpackTab = 'sell'; openModal(backpackTemplate()); });
  function backpackTemplate(){
    return '<div class="modal">' +
      '<button class="modal-close" data-close type="button">✕</button>' +
      '<img class="market-banner" src="assets/ui/ui-screen-island-market-banner.jpg" alt="">' +
      '<div class="modal-header-row"><h3>Balo</h3><span class="pearl-balance">' + orderResourceIcon('pearl') + state.pearls + '</span></div>' +
      '<div class="tab-row">' +
        '<button class="tab-btn' + (backpackTab === 'sell' ? ' active' : '') + '" data-tab="sell" type="button">Bán</button>' +
        '<button class="tab-btn' + (backpackTab === 'market' ? ' active' : '') + '" data-tab="market" type="button">Chợ</button>' +
        '<button class="tab-btn' + (backpackTab === 'collection' ? ' active' : '') + '" data-tab="collection" type="button">Bộ sưu tập</button>' +
      '</div>' +
      (backpackTab === 'sell' ? sellTabHtml() : backpackTab === 'market' ? marketTabHtml() : collectionTabHtml()) +
    '</div>';
  }
  function sellTabHtml(){
    var chips = ['crop','meat','wood'].map(function(k){
      return '<div class="item-chip">' + ITEM_ART[k]() + '<span class="item-count">×' + state.inv[k] + '</span><span class="muted">' + ITEM_NAMES[k] + '</span></div>';
    }).join('');
    var body = state.merchantAvailable
      ? '<p class="muted">Một thuyền buôn đã ghé Vịnh — bán tài nguyên lấy vàng theo giá: nông sản ' + RATES.crop + 'đ, thịt ' + RATES.meat + 'đ, gỗ ' + RATES.wood + 'đ mỗi phần.</p>'
      : '<p class="muted">Vịnh buôn bán hiện chưa có thuyền ghé — quay lại sau vài ngày.</p>';
    return '<div class="item-row">' + chips + '</div>' + body +
      '<div class="modal-actions">' +
        (state.merchantAvailable ? '<button class="m-btn primary" id="btn-sell" type="button">Bán tất cả cho thương nhân</button>' : '') +
      '</div>';
  }
  function sellAll(){
    var total = 0, parts = [];
    ['crop','meat','wood'].forEach(function(k){
      if(state.inv[k] > 0){ total += state.inv[k] * RATES[k]; parts.push(state.inv[k] + ' ' + ITEM_NAMES[k]); state.inv[k] = 0; }
    });
    if(total === 0){ toast('Bạn chưa có gì để bán.'); return; }
    state.gold += total;
    addLog('Bạn đã bán ' + parts.join(', ') + ' cho thương nhân, nhận ' + total + ' vàng.');
    state.merchantAvailable = false;
    state.nextMerchantDay = state.day + rand(2,4);
    save(); closeModal(); renderAll(); checkGoal();
    toast('Đã bán, nhận +' + total + ' vàng.');
  }

  function marketTabHtml(){
    var cards = MARKET_ITEMS.map(marketItemCardHtml).join('');
    return '<p class="muted">Đổi Pearl kiếm được từ Bảng đơn hàng lấy đồ trang trí cho đảo.</p>' +
      '<div class="market-grid">' + cards + '</div>';
  }
  function marketItemCardHtml(item){
    var owned = state.decorations[item.id] || 0;
    var maxedOut = !item.repeatable && owned > 0;
    var canAfford = state.pearls >= item.price;
    var disabled = maxedOut || !canAfford;
    var btnLabel = maxedOut ? 'Đã sở hữu' : (canAfford ? 'Mua' : 'Thiếu ' + (item.price - state.pearls));
    return '<div class="market-card">' +
      '<span class="market-card-icon">' + orderResourceIcon(item.icon) + '</span>' +
      '<span class="market-card-name">' + item.name + '</span>' +
      '<span class="market-card-price">' + orderResourceIcon('pearl') + item.price + '</span>' +
      (owned > 0 ? '<span class="market-card-owned">Đã có ×' + owned + '</span>' : '') +
      '<button class="m-btn primary market-buy" data-item="' + item.id + '" type="button"' + (disabled ? ' disabled' : '') + '>' + btnLabel + '</button>' +
    '</div>';
  }
  function buyDecoration(itemId){
    var item = MARKET_ITEMS.find(function(m){ return m.id === itemId; });
    if(!item) return;
    var owned = state.decorations[itemId] || 0;
    if((!item.repeatable && owned > 0) || state.pearls < item.price) return;
    state.pearls -= item.price;
    state.decorations[itemId] = owned + 1;
    addLog('Bạn đã đổi ' + item.price + ' Pearl lấy ' + item.name + '.');
    toast('Đã mua ' + item.name + '!');
    save();
    openModal(backpackTemplate());
  }

  // "đã sở hữu" is one shared list regardless of how each piece was acquired (bought or crafted)
  function collectionTabHtml(){
    var decorCards = MARKET_ITEMS.map(function(item){
      var owned = state.decorations[item.id] || 0;
      return '<div class="market-card' + (owned ? '' : ' unowned') + '">' +
        '<span class="market-card-icon">' + orderResourceIcon(item.icon) + '</span>' +
        '<span class="market-card-name">' + item.name + '</span>' +
        '<span class="market-card-owned">' + (owned ? 'Đã có ×' + owned : 'Chưa có') + '</span>' +
      '</div>';
    }).join('');
    // static preview only — no unlock logic, no state, nothing saved; Chapter 2 content
    var petCards = PET_PREVIEW.map(function(pet){
      return '<div class="market-card unowned">' +
        '<span class="market-card-icon">' + petIcon(pet.icon) + '</span>' +
        '<span class="market-card-name">' + pet.name + '</span>' +
        '<span class="pet-lock-row">' + petIcon(artLock) + '<span class="pet-lock-label">' + pet.lockText + '</span></span>' +
      '</div>';
    }).join('');
    return '<p class="muted">Đồ trang trí đã sở hữu — mua ở Chợ hoặc làm ở Xưởng chế tạo. Chưa đặt lên đảo được ở bản này.</p>' +
      '<h4 class="collection-group-label">Đồ trang trí</h4>' +
      '<div class="market-grid">' + decorCards + '</div>' +
      '<img class="market-banner" src="assets/ui/ui-screen-animal-sanctuary-banner.jpg" alt="">' +
      '<h4 class="collection-group-label">Thú nuôi</h4>' +
      '<div class="market-grid">' + petCards + '</div>';
  }
  function petIcon(fn){ return '<svg viewBox="0 0 24 24" class="res-icon-img">' + fn() + '</svg>'; }

  modalRoot.addEventListener('click', function(e){
    if(e.target.closest('#btn-sell')){ sellAll(); return; }
    var tabBtn = e.target.closest('.tab-btn');
    if(tabBtn){ backpackTab = tabBtn.getAttribute('data-tab'); openModal(backpackTemplate()); return; }
    var buyBtn = e.target.closest('.market-buy');
    if(buyBtn && !buyBtn.disabled){ buyDecoration(buyBtn.getAttribute('data-item')); return; }
    var craftBtn = e.target.closest('.craft-item');
    if(craftBtn && !craftBtn.disabled) craftDecoration(craftBtn.getAttribute('data-item'));
  });

  /* ---------------- crafting workshop ---------------- */
  document.getElementById('btn-craft').addEventListener('click', function(){ openModal(craftingTemplate()); });
  function craftingTemplate(){
    var craftable = MARKET_ITEMS.filter(function(m){ return m.craft; });
    var cards = craftable.map(craftItemCardHtml).join('');
    return '<div class="modal">' +
      '<button class="modal-close" data-close type="button">✕</button>' +
      '<img class="market-banner" src="assets/ui/ui-modal-crafting-workshop-banner.jpg" alt="">' +
      '<h3>Xưởng chế tạo</h3>' +
      '<p class="muted">Dùng nguyên liệu thô có sẵn để làm đồ trang trí — không tốn Pearl.</p>' +
      '<div class="order-list">' + cards + '</div>' +
    '</div>';
  }
  function craftItemCardHtml(item){
    var owned = state.decorations[item.id] || 0;
    var maxedOut = !item.repeatable && owned > 0;
    var has = hasEnoughResources(item.craft);
    var reqHtml = item.craft.map(function(r){
      var have = state.inv[r.resource] || 0;
      return '<span class="order-req-chip' + (have < r.qty ? ' short' : '') + '">' + orderResourceIcon(r.resource) +
        '<b>' + have + '/' + r.qty + '</b> ' + ORDER_RES_LABEL[r.resource] + '</span>';
    }).join('');
    return '<div class="order-card">' +
      '<div class="craft-card-head"><span class="market-card-icon">' + orderResourceIcon(item.icon) + '</span><b>' + item.name + '</b></div>' +
      '<div class="order-row">' + reqHtml + '</div>' +
      (owned > 0 ? '<span class="market-card-owned">Đã có ×' + owned + '</span>' : '') +
      '<button class="m-btn primary craft-item" data-item="' + item.id + '" type="button"' + (maxedOut || !has ? ' disabled' : '') + '>' +
        (maxedOut ? 'Đã sở hữu' : 'Chế tạo') +
      '</button>' +
      (!maxedOut && !has ? '<span class="order-hint">Cần thêm: ' + missingResourcesText(item.craft) + '</span>' : '') +
    '</div>';
  }
  function craftDecoration(itemId){
    var item = MARKET_ITEMS.find(function(m){ return m.id === itemId && m.craft; });
    if(!item) return;
    var owned = state.decorations[itemId] || 0;
    if((!item.repeatable && owned > 0) || !hasEnoughResources(item.craft)) return;
    item.craft.forEach(function(r){ state.inv[r.resource] -= r.qty; });
    state.decorations[itemId] = owned + 1;
    addLog('Bạn đã chế tạo ' + item.name + '.');
    toast('Đã chế tạo ' + item.name + '!');
    save();
    renderHud();
    openModal(craftingTemplate());
  }

  /* ---------------- order board ---------------- */
  document.getElementById('goal-bar').addEventListener('click', function(){ openModal(orderBoardTemplate()); });
  function orderBoardTemplate(){
    var cards = state.orders.length
      ? state.orders.map(orderCardHtml).join('')
      : '<p class="muted">Bảng đơn hàng đang trống — quay lại sau vài ngày.</p>';
    return '<div class="modal">' +
      '<button class="modal-close" data-close type="button">✕</button>' +
      '<img class="market-banner" src="assets/ui/ui-screen-order-board-banner.jpg" alt="">' +
      '<h3>Bảng đơn hàng đảo</h3>' +
      '<p class="muted">Giao đúng tài nguyên yêu cầu để đổi lấy vàng.</p>' +
      '<div class="order-list">' + cards + '</div>' +
    '</div>';
  }
  function orderCardHtml(order){
    var has = orderHasEnough(order);
    var reqHtml = order.requires.map(function(r){
      var short = (state.inv[r.resource] || 0) < r.qty ? ' short' : '';
      return '<span class="order-req-chip' + short + '">' + orderResourceIcon(r.resource) + '<b>' + r.qty + '</b> ' + ORDER_RES_LABEL[r.resource] + '</span>';
    }).join('');
    var rewardHtml = '<span class="order-reward-chip">' + orderResourceIcon(order.reward.resource) + '+' + order.reward.qty + ' ' + ORDER_RES_LABEL[order.reward.resource] + '</span>';
    return '<div class="order-card" data-order="' + order.id + '">' +
      '<div class="order-row">' + reqHtml + '<span class="order-arrow">→</span>' + rewardHtml + '</div>' +
      '<button class="m-btn primary order-deliver" data-order="' + order.id + '" type="button"' + (has ? '' : ' disabled') + '>' +
        (has ? 'Giao hàng' : 'Chưa đủ hàng') +
      '</button>' +
      (has ? '' : '<span class="order-hint">Cần thêm: ' + orderMissingText(order) + '</span>') +
    '</div>';
  }
  function fulfillOrder(orderId){
    var order = state.orders.find(function(o){ return o.id === orderId; });
    if(!order || !orderHasEnough(order)) return;
    order.requires.forEach(function(r){ state.inv[r.resource] -= r.qty; });
    if(order.reward.resource === 'gold'){ state.gold += order.reward.qty; }
    else { state.inv[order.reward.resource] = (state.inv[order.reward.resource] || 0) + order.reward.qty; }
    state.ordersDelivered++;
    var pearlAwarded = (state.ordersDelivered % ORDERS_PER_PEARL === 0);
    if(pearlAwarded) state.pearls++;
    var gainedText = '+' + order.reward.qty + ' ' + ORDER_RES_LABEL[order.reward.resource] + (pearlAwarded ? ', +1 Pearl' : '');
    addLog('Bạn đã giao một đơn hàng, nhận ' + gainedText + '.');
    var cardEl = modalRoot.querySelector('.order-card[data-order="' + orderId + '"]');
    if(cardEl) cardEl.classList.add('order-complete');
    toast('Đã giao đơn hàng! ' + gainedText + (pearlAwarded ? ' — mốc ' + ORDERS_PER_PEARL + ' đơn!' : '') + '.');
    setTimeout(function(){
      var idx = state.orders.findIndex(function(o){ return o.id === orderId; });
      if(idx >= 0) state.orders.splice(idx, 1);
      state.nextOrderRefillDay = Math.max(state.nextOrderRefillDay, state.day + ORDER_REFILL_DELAY);
      save(); renderHud(); checkGoal();
      openModal(orderBoardTemplate());
    }, 320);
  }
  modalRoot.addEventListener('click', function(e){
    var btn = e.target.closest('.order-deliver');
    if(btn && !btn.disabled) fulfillOrder(btn.getAttribute('data-order'));
  });

  /* ---------------- journal / end day ---------------- */
  document.getElementById('btn-journal').addEventListener('click', function(){ openModal(journalTemplate()); bindJournal(); });
  function journalTemplate(){
    var logHtml = state.log.length
      ? state.log.map(function(l){ return '<p class="journal-line"><span class="journal-day">Ngày ' + l.day + '.</span>' + escapeHtml(l.text) + '</p>'; }).join('')
      : '<p class="journal-line muted">Chưa có sự kiện nào được ghi lại.</p>';
    return '<div class="modal">' +
      '<button class="modal-close" data-close type="button">✕</button>' +
      '<h3>Sổ tay nhật ký</h3>' +
      '<div class="journal-list">' + logHtml + '</div>' +
      '<div class="modal-actions"><button class="m-btn primary" id="btn-endday" type="button">Nghỉ ngơi — Qua ngày</button></div>' +
    '</div>';
  }
  function bindJournal(){
    var btn = document.getElementById('btn-endday');
    if(btn) btn.addEventListener('click', endDay);
  }
  function endDay(){
    if(state.encounter) return;
    state.energy = maxEnergy();
    state.hp = Math.min(maxHp(), state.hp + 2);
    state.farm.forEach(function(t){ if(t.stage === 2) t.stage = 3; });
    state.day += 1;
    if(!state.merchantAvailable && state.day >= state.nextMerchantDay){
      state.merchantAvailable = true;
      addLog('Bạn thấy một cánh buồm lạ ghé vào Vịnh buôn bán...');
    }
    if(Math.random() < 0.35) addLog(FLAVORS[Math.floor(Math.random() * FLAVORS.length)]);
    refillOrders();
    save(); closeModal(); renderAll(); checkGoal();
  }
  function checkGoal(){
    if(!state.goalReached && state.gold >= 50){
      state.goalReached = true;
      addLog('Bạn đã tích đủ 50 vàng — đủ để bắt đầu đóng một chiếc bè ra khơi tìm đảo mới. (Tính năng dong thuyền sẽ có ở bản cập nhật tiếp theo!)');
      save();
    }
  }

  /* ---------------- coming-soon placeholders ---------------- */
  document.getElementById('btn-friends').addEventListener('click', function(){ toast('Hải âu đưa thư & bạn bè sẽ có ở bản cập nhật tiếp theo!'); });

  /* ---------------- reset ---------------- */
  function resetConfirmTemplate(){
    return '<div class="modal center">' +
      '<h3>Chơi lại từ đầu?</h3>' +
      '<p class="muted">Toàn bộ tiến trình hiện tại (ngày, tài nguyên, ruộng) sẽ bị xoá vĩnh viễn.</p>' +
      '<div class="modal-actions">' +
        '<button class="m-btn primary" id="btn-reset-confirm" type="button">Xác nhận xoá</button>' +
        '<button class="m-btn ghost" data-close type="button">Huỷ</button>' +
      '</div></div>';
  }
  modalRoot.addEventListener('click', function(e){
    if(e.target && e.target.id === 'btn-reset-confirm'){
      try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
      state = defaultState();
      closeModal();
      renderAll();
    }
  });

  /* ---------------- master render ---------------- */
  function renderAll(){
    if(state.encounter){ refreshCombatModal(); return; }
    if(state.claimedDay < state.day){ showScreen('checkin'); renderCheckin(); return; }
    if(!state.talent){ showScreen('choice'); return; }
    showScreen('homestead');
    renderHud();
    renderFarm();
    if(!state.seenTutorial && !document.getElementById('tut-overlay')) startTutorial();
  }

  /* ---------------- boot ---------------- */
  state = load() || defaultState();
  if(!Array.isArray(state.orders)) state.orders = seedInitialOrders(state.day); // migrate saves from before the order board
  if(typeof state.nextOrderRefillDay !== 'number') state.nextOrderRefillDay = state.day;
  if(typeof state.pearls !== 'number') state.pearls = 0; // migrate saves from before Pearls/the island market
  if(typeof state.ordersDelivered !== 'number') state.ordersDelivered = 0;
  if(!state.decorations) state.decorations = {};
  renderAll();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
