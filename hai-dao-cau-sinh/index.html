<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hải Đảo Cầu Sinh — Homestead</title>
<meta name="description" content="Hải Đảo Cầu Sinh — cozy island survival, màn Homestead.">
<meta name="theme-color" content="#FA8231">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cầu Sinh">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --turquoise:#2BB8A6;
    --turquoise-deep:#1E8C7F;
    --sand:#F4D06F;
    --driftwood:#8B5A2B;
    --driftwood-deep:#6B4423;
    --palm:#4E9F3D;
    --coral:#FA8231;
    --coral-deep:#D9631A;
    --paper:#FFF8E8;
    --paper-deep:#FBEFC9;
    --card:#FFFCF2;
    --ink:#4A2E14;
    --ink-soft:#8A6A45;
    --line:rgba(74,46,20,0.16);
    --shadow:rgba(74,46,20,0.25);
    --cream:#FFFBEF;

    /* theme-controlled tokens — default = day */
    --scene-sky-a:#BFEDEA;
    --scene-sky-b:#EFE3B0;
    --scene-sand:#F6DE9A;
    --surface:var(--card);
    --surface-border:var(--driftwood);
    --surface-ink:var(--ink);
    --dock-a:var(--driftwood);
    --dock-b:var(--driftwood-deep);
    --dock-btn:#A9762F;
    --campfire-glow:none;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper-deep);
    color:var(--ink);
    font-family:"Quicksand",-apple-system,"Segoe UI",sans-serif;
  }
  h1,h2,h3{font-family:"Baloo 2","Segoe UI",sans-serif;margin:0;}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
  button:focus-visible, a:focus-visible{outline:2px solid var(--turquoise-deep);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }

  /* ---------- responsive app shell ---------- */
  /* Full-bleed on real phones; a centered card once there's room to spare. */
  .app{
    position:relative;
    width:100%;
    max-width:480px;
    min-height:100dvh;
    margin:0 auto;
    background:var(--paper);
    overflow:hidden;
  }
  @media (min-width:560px){
    body{display:flex;justify-content:center;padding:28px 16px;}
    .app{
      height:min(880px, calc(100dvh - 56px));
      min-height:0;
      border-radius:28px;
      border:1px solid var(--line);
      box-shadow:0 30px 60px var(--shadow);
    }
  }

  .screen{
    position:absolute;inset:0;display:flex;flex-direction:column;
    padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  }
  .screen[hidden]{display:none;}

  /* ---------- settings popover (theme preview + replay, demo aid) ---------- */
  .settings-toggle{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:60;
    width:34px;height:34px;border-radius:50%;background:rgba(255,252,242,.9);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px var(--shadow);
  }
  .settings-toggle svg{width:56%;height:56%;color:var(--ink-soft);}
  .settings-panel{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 48px);right:10px;z-index:60;
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;
    box-shadow:0 12px 26px var(--shadow);display:flex;flex-direction:column;gap:8px;
    opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .15s ease, transform .15s ease;
  }
  .settings-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .settings-panel[hidden]{display:none;}
  .settings-label{font-family:"JetBrains Mono",monospace;font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;}
  .theme-switch{display:flex;gap:4px;background:var(--paper-deep);border-radius:999px;padding:3px;}
  .theme-btn{font-family:"Baloo 2";font-size:0.72rem;font-weight:700;padding:5px 9px;border-radius:999px;color:var(--ink-soft);white-space:nowrap;}
  .theme-btn.active{background:var(--turquoise);color:#fff;}
  .replay-link{font-size:0.72rem;color:var(--ink-soft);text-decoration:underline;white-space:nowrap;text-align:left;}

  /* ================= HOMESTEAD — Prompt 1 (top: 1b · dock: 1c) ================= */
  .hud-topbar{
    margin:0 10px;flex:0 0 auto;
    background:var(--surface);border:2px solid var(--surface-border);border-radius:18px;
    padding:6px 8px;display:flex;align-items:center;gap:8px;color:var(--surface-ink);
  }
  .hud-avatar{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--turquoise);border:2px solid var(--cream);display:flex;align-items:center;justify-content:center;}
  .hud-avatar svg{width:60%;height:60%;color:var(--cream);}
  .hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .hud-mid-row{display:flex;justify-content:space-between;gap:6px;font-size:0.78rem;font-weight:600;}
  .hud-mid-row .lvl{white-space:nowrap;}
  .hud-mid-row .day{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stamina-bar{height:8px;border-radius:999px;background:rgba(0,0,0,0.18);overflow:hidden;}
  .stamina-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#BFEFEF,var(--turquoise));}
  .hud-weather{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--surface-border);display:flex;align-items:center;justify-content:center;color:var(--surface-ink);}
  .hud-weather svg{width:60%;height:60%;}

  .resource-row{flex:0 0 auto;display:flex;gap:6px;margin:7px 10px 0;}
  .res-chip{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card);border:1.5px solid var(--driftwood);border-radius:12px;padding:4px 6px;font-size:0.76rem;font-weight:700;color:var(--ink);}
  .res-chip svg{width:15px;height:15px;flex:0 0 auto;}

  .viewport{
    flex:1;margin:8px 10px 0;border-radius:12px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--scene-sky-a) 0%,var(--scene-sky-a) 38%,var(--scene-sky-b) 38%,var(--scene-sand) 100%);
  }
  .vp-palm{position:absolute;width:16%;color:var(--palm);opacity:.9;}
  .vp-palm.left{left:3%;top:5%;}
  .vp-palm.right{right:4%;top:8%;transform:scaleX(-1);}
  .vp-raft{position:absolute;left:50%;bottom:32%;transform:translateX(-50%);width:30%;opacity:.9;}
  .vp-campfire{position:absolute;left:50%;bottom:40%;width:11%;transform:translateX(120%);filter:drop-shadow(var(--campfire-glow));}
  .vp-plots{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:center;gap:6%;padding:0 8%;}
  .plot{
    width:24%;aspect-ratio:5/4;border:2px dashed var(--driftwood-deep);border-radius:9px;
    background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;
  }
  .plot:hover{background:rgba(255,255,255,.42);}
  .plot.planted{border-style:solid;background:rgba(255,255,255,.5);}
  .plot svg{width:56%;height:56%;}

  .storm-banner{
    flex:0 0 auto;margin:8px 10px 0;border:2px solid var(--coral);border-radius:10px;padding:5px 8px;
    font-size:0.72rem;font-weight:700;color:var(--coral-deep);background:var(--cream);text-align:center;
  }

  .quest-bar{
    flex:0 0 auto;margin:8px 10px 0;background:var(--surface);border-radius:12px;padding:6px 10px;
    display:flex;align-items:center;gap:7px;color:var(--surface-ink);
  }
  .quest-bar svg{width:16px;height:16px;flex:0 0 auto;color:var(--coral);}
  .quest-text{flex:1;min-width:0;font-size:0.78rem;line-height:1.25;}
  .quest-tag{font-family:"JetBrains Mono",monospace;font-size:0.6rem;color:var(--ink-soft);flex:0 0 auto;}

  .dock{
    flex:0 0 auto;position:relative;margin-top:10px;height:78px;overflow:visible;
    background:linear-gradient(180deg,var(--dock-a),var(--dock-b));
    border-top:2px solid var(--driftwood-deep);
    display:flex;align-items:center;justify-content:space-around;
    padding:0 8px calc(env(safe-area-inset-bottom,0px));
  }
  .dock-btn{width:44px;height:44px;border-radius:50%;background:var(--dock-btn);border:2px solid var(--driftwood-deep);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 4px rgba(0,0,0,.25);}
  .dock-btn svg{width:52%;height:52%;color:var(--cream);}
  .dock-cta{
    width:74px;height:74px;margin-top:-34px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#FFAE6B,var(--coral) 60%,var(--coral-deep) 100%);
    border:3px solid var(--cream);box-shadow:0 6px 14px var(--shadow);z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .dock-cta svg{width:34%;color:#fff;}
  .dock-cta span{font-family:"Baloo 2";font-size:0.62rem;font-weight:800;color:#fff;margin-top:1px;}
  .dock-cta small{font-size:0.5rem;color:rgba(255,255,255,.9);}
  .dock-cta.locked{opacity:.5;cursor:not-allowed;}
  .dock-cta.shake{animation:shake .3s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---- theme overrides — Prompt 2 (tokens only, layout untouched) ---- */
  .app[data-theme="night"]{
    --scene-sky-a:#1c2733;--scene-sky-b:#2c3440;--scene-sand:#232b35;
    --surface:rgba(233,229,220,0.14);--surface-border:rgba(233,229,220,0.55);--surface-ink:#EDE5D4;
    --dock-a:#232b35;--dock-b:#141a21;--dock-btn:#3a4450;
    --campfire-glow:0 0 10px 4px rgba(250,130,49,.65);
  }
  .app[data-theme="night"] .screen-homestead{background:#1b232c;}
  .app[data-theme="night"] .res-chip{background:rgba(233,229,220,.1);border-color:rgba(233,229,220,.4);color:#EDE5D4;}

  .app[data-theme="storm"]{
    --scene-sky-a:#c7cdc9;--scene-sky-b:#dfe3e0;--scene-sand:#cbc2a8;
  }

  /* ================= SEED POPUP — Prompt 3 (E1) ================= */
  .seed-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);z-index:40;transition:background .18s ease;}
  .seed-overlay.show{background:rgba(0,0,0,.3);}
  .seed-overlay[hidden]{display:none;}
  .seed-popup{
    position:absolute;width:220px;background:var(--card);border:2px solid var(--driftwood);border-radius:12px;
    padding:10px;box-shadow:0 10px 22px var(--shadow);opacity:0;transform:translate(-50%,6px) scale(.94);
    transition:opacity .18s ease, transform .18s ease;
  }
  .seed-overlay.show .seed-popup{opacity:1;transform:translate(-50%,0) scale(1);}
  .seed-popup-head{display:flex;align-items:center;justify-content:space-between;font-size:0.85rem;font-weight:700;margin-bottom:8px;color:var(--ink);}
  .seed-close{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--coral);color:var(--coral);display:flex;align-items:center;justify-content:center;font-size:11px;}
  .seed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .seed-opt{aspect-ratio:1;border:1.5px solid var(--driftwood);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--cream);}
  .seed-opt svg{width:50%;height:50%;}
  .seed-opt span{font-size:0.6rem;font-weight:600;}
  .seed-opt.locked{border-style:dashed;border-color:var(--line);color:var(--ink-soft);background:transparent;}
  .seed-opt.locked span{font-size:0.52rem;line-height:1.15;text-align:center;color:var(--ink-soft);}
  .seed-arrow{position:absolute;bottom:-10px;left:50%;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--driftwood);transform:translateX(-50%);}

  /* ================= CHECK-IN — Prompt 4 (F2) ================= */
  .checkin-head{flex:0 0 auto;text-align:center;font-size:0.86rem;font-weight:700;color:var(--ink);padding:2px 10px 8px;}
  .checkin-scene{flex:0 0 auto;position:relative;height:26%;overflow:hidden;border-radius:10px;margin:0 10px;}
  .ci-sky{position:absolute;inset:0;background:linear-gradient(180deg,#BFE4EE,#EAF6EC);}
  .ci-sun{position:absolute;right:16%;top:18%;width:13%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff6d8,var(--sand));}
  .ci-sea{position:absolute;left:0;right:0;bottom:24%;height:22%;background:#3f8f95;overflow:hidden;}
  .ci-wave{position:absolute;left:0;right:-120px;bottom:0;height:14px;opacity:.35;background-repeat:repeat-x;background-size:120px 20px;animation:waveMove 6s linear infinite;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 20'><path d='M0 10 Q15 0 30 10 T60 10 T90 10 T120 10 V20 H0 Z' fill='%23ffffff'/></svg>");}
  @keyframes waveMove{from{background-position-x:0}to{background-position-x:120px}}
  .ci-shore{position:absolute;left:0;right:0;bottom:0;height:24%;background:var(--sand);}
  .ci-palm{position:absolute;left:8%;bottom:14%;width:15%;color:var(--driftwood-deep);}

  .checkin-card{
    flex:1;margin:10px;background:var(--card);border:2px solid var(--driftwood);border-radius:14px;
    padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  }
  .checkin-line{font-size:0.86rem;font-weight:600;color:var(--ink);}
  .checkin-chest{width:78px;height:56px;position:relative;transform-origin:bottom center;}
  .checkin-chest.opening{animation:chestOpen .5s ease;}
  @keyframes chestOpen{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.12) rotate(-6deg)}70%{transform:scale(1.05) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
  .checkin-sub{font-size:0.74rem;color:var(--ink-soft);}
  .streak-dots{display:flex;gap:6px;margin-top:2px;}
  .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);}
  .dot.filled{background:var(--turquoise);border-color:var(--turquoise);}
  .dot.today{border-color:var(--coral);border-width:2px;}

  .cta-pill{
    flex:0 0 auto;margin:0 10px calc(env(safe-area-inset-bottom,0px) + 12px);height:46px;border-radius:23px;
    background:var(--coral);border:2.5px solid var(--driftwood);color:#fff;
    font-family:"Baloo 2";font-weight:700;font-size:0.9rem;
    display:flex;align-items:center;justify-content:center;
  }

  #toast{
    position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);
    background:var(--ink);color:var(--cream);padding:9px 16px;border-radius:999px;font-size:0.82rem;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:80;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app" id="app" data-theme="day">
  <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Tuỳ chọn xem trước">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
  <div class="settings-panel" id="settings-panel" hidden>
    <span class="settings-label">Xem thử theme</span>
    <div class="theme-switch" role="group" aria-label="Chọn theme thời tiết/thời gian">
      <button class="theme-btn active" data-theme-btn="day" type="button">☀ Ngày</button>
      <button class="theme-btn" data-theme-btn="night" type="button">☾ Đêm</button>
      <button class="theme-btn" data-theme-btn="storm" type="button">⛈ Bão</button>
    </div>
    <button class="replay-link" id="btn-replay" type="button">↺ Xem lại màn điểm danh</button>
  </div>

    <!-- ============== CHECK-IN SCREEN (Prompt 4) ============== -->
    <section class="screen screen-checkin" id="screen-checkin">
      <div class="checkin-head" id="checkin-daylabel">Ngày 14 · Bình minh</div>
      <div class="checkin-scene">
        <div class="ci-sky"><div class="ci-sun"></div></div>
        <div class="ci-sea"><div class="ci-wave"></div></div>
        <div class="ci-shore">
          <svg class="ci-palm" viewBox="0 0 60 80" fill="none"><path d="M32 78c0-24 2-40 6-52" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M38 26c-10-6-20-6-28-2 8 8 18 9 28 2Z" fill="currentColor"/><path d="M38 26c-4-10-2-18 4-24 6 8 6 17 -4 24Z" fill="currentColor"/><path d="M38 26c10-6 20-6 28-2-8 8-18 9-28 2Z" fill="currentColor"/></svg>
        </div>
      </div>
      <div class="checkin-card">
        <p class="checkin-line">Sóng đêm dạt vào 1 chiếc rương</p>
        <div class="checkin-chest" id="checkin-chest">
          <svg viewBox="0 0 78 56" fill="none">
            <rect x="4" y="26" width="70" height="26" rx="4" fill="#8B5A2B" stroke="#4A2E14" stroke-width="2"/>
            <path d="M4 28c0-12 15-20 35-20s35 8 35 20" fill="#A9762F" stroke="#4A2E14" stroke-width="2"/>
            <rect x="33" y="24" width="12" height="10" rx="2" fill="#F4D06F" stroke="#4A2E14" stroke-width="1.6"/>
          </svg>
        </div>
        <p class="checkin-sub" id="checkin-sub">Chạm để mở — phần thưởng ngày 14</p>
        <div class="streak-dots" aria-hidden="true">
          <span class="dot filled"></span><span class="dot filled"></span><span class="dot today"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
      <button class="cta-pill" id="btn-open-chest" type="button">Mở rương</button>
    </section>

    <!-- ============== HOMESTEAD SCREEN (Prompt 1 + 3) ============== -->
    <section class="screen screen-homestead" id="screen-homestead" hidden>
      <div class="hud-topbar">
        <div class="hud-avatar"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-5 5-7 8-7s6.5 2 8 7Z"/></svg></div>
        <div class="hud-mid">
          <div class="hud-mid-row"><span class="lvl">Lv.7</span><span class="day" id="hud-day-label">Ngày 14 · Nắng gắt</span></div>
          <div class="stamina-bar"><div class="stamina-fill" style="width:62%"></div></div>
        </div>
        <div class="hud-weather" id="hud-weather-dot"></div>
      </div>

      <div class="resource-row">
        <div class="res-chip"><svg viewBox="0 0 24 24" fill="#F4D06F"><path d="M12 2c4 4 8 9 8 14a8 8 0 0 1-16 0c0-5 4-10 8-14Z"/></svg>248</div>
        <div class="res-chip"><svg viewBox="0 0 24 24" fill="#8B5A2B"><rect x="3" y="9" width="18" height="5" rx="2"/></svg>36</div>
        <div class="res-chip"><svg viewBox="0 0 24 24" fill="#2BB8A6"><path d="M3 12c4-5 9-6 13-3-1 2-1 4 0 6-4 3-9 2-13-3Z"/><circle cx="6.5" cy="11" r="1"/></svg>9</div>
      </div>

      <div class="viewport" id="viewport">
        <svg class="vp-palm left" viewBox="0 0 60 80" fill="none"><path d="M32 78c0-24 2-40 6-52" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M38 26c-10-6-20-6-28-2 8 8 18 9 28 2Z" fill="currentColor"/><path d="M38 26c-4-10-2-18 4-24 6 8 6 17 -4 24Z" fill="currentColor"/><path d="M38 26c10-6 20-6 28-2-8 8-18 9-28 2Z" fill="currentColor"/></svg>
        <svg class="vp-palm right" viewBox="0 0 60 80" fill="none"><path d="M32 78c0-24 2-40 6-52" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M38 26c-10-6-20-6-28-2 8 8 18 9 28 2Z" fill="currentColor"/><path d="M38 26c-4-10-2-18 4-24 6 8 6 17 -4 24Z" fill="currentColor"/><path d="M38 26c10-6 20-6 28-2-8 8-18 9-28 2Z" fill="currentColor"/></svg>
        <svg class="vp-raft" viewBox="0 0 80 24" fill="none"><rect x="2" y="10" width="76" height="8" rx="3" fill="#A9762F"/><line x1="2" y1="14" x2="78" y2="14" stroke="#6B4423" stroke-width="1"/></svg>
        <svg class="vp-campfire" viewBox="0 0 30 30" fill="none"><path d="M4 22l22-6M4 18l22 4" stroke="#6B4423" stroke-width="2.4" stroke-linecap="round"/><path d="M15 20c-2-4 0-7 2-9-1 3 1 4 2 6 1-2 0-4-1-6 3 2 4 6 2 9-1 2-4 2-5 0Z" fill="#FA8231"/></svg>
        <div class="vp-plots" id="vp-plots">
          <button class="plot" data-tile="0" type="button" aria-label="Ô đất 1"></button>
          <button class="plot" data-tile="1" type="button" aria-label="Ô đất 2"></button>
          <button class="plot" data-tile="2" type="button" aria-label="Ô đất 3"></button>
        </div>
      </div>

      <div class="storm-banner" id="storm-banner" hidden>⚠ Cảnh báo: Mưa bão — che chắn mái lá</div>

      <div class="quest-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-5 2 2-5 5-2Z" fill="currentColor" stroke="none"/></svg>
        <span class="quest-text">Dựng giàn lọc nước biển <b>0/1</b></span>
        <span class="quest-tag">quest</span>
      </div>

      <div class="dock">
        <button class="dock-btn" title="Balo / Kho" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="8" width="14" height="13" rx="3"/><rect x="8" y="4" width="8" height="6" rx="2"/></svg></button>
        <button class="dock-btn" title="Chế tạo / Xây dựng" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 4l6 6-3 3-6-6Z" fill="currentColor" stroke="none"/><path d="M12.5 8.5 4 17l3 3 8.5-8.5"/></svg></button>
        <button class="dock-cta" id="cta-sail" title="Ra Khơi" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.5 6.5l3 3M14.5 14.5l3 3M17.5 6.5l-3 3M9.5 14.5l-3 3"/><circle cx="12" cy="12" r="2" fill="#fff" stroke="none"/></svg>
          <span>RA KHƠI</span><small>−10 nước</small>
        </button>
        <button class="dock-btn" title="Sổ tay / Đồ giám" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="14" height="17" rx="2"/><line x1="8" y1="9" x2="16" y2="9" stroke="#8B5A2B" stroke-width="1.4"/><line x1="8" y1="13" x2="16" y2="13" stroke="#8B5A2B" stroke-width="1.4"/></svg></button>
        <button class="dock-btn" title="Hải âu đưa thư / Bạn bè" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 14c4-6 8-2 10 0 2-2 6-6 10 0-5 1-7 4-10 7-3-3-5-6-10-7Z"/></svg></button>
      </div>
    </section>

    <!-- seed picker popup — anchored per tapped tile -->
    <div class="seed-overlay" id="seed-overlay" hidden>
      <div class="seed-popup" id="seed-popup">
        <div class="seed-popup-head">Chọn hạt giống<button class="seed-close" id="seed-close" type="button" aria-label="Đóng">✕</button></div>
        <div class="seed-grid">
          <button class="seed-opt" data-seed="dua" type="button">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#4E9F3D"/><path d="M12 4a8 8 0 0 1 0 16" fill="#3d7d30"/><circle cx="12" cy="12" r="9" fill="none" stroke="#2f6024" stroke-width="1.2" stroke-dasharray="2 3"/></svg>
            <span>Dưa</span>
          </button>
          <button class="seed-opt" data-seed="ngo" type="button">
            <svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="4" fill="#F4D06F"/><path d="M9 6h6M9 9h6M9 12h6M9 15h6" stroke="#c99a2e" stroke-width="1.1"/></svg>
            <span>Ngô</span>
          </button>
          <button class="seed-opt" data-seed="san" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 2c3 4 5 8 5 12a5 5 0 0 1-10 0c0-4 2-8 5-12Z" fill="#C9A06C"/></svg>
            <span>Sắn</span>
          </button>
          <button class="seed-opt locked" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <span>Khoá Lv.15</span>
          </button>
        </div>
        <div class="seed-arrow"></div>
      </div>
    </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var WEATHER_ICON = {
    day: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></g></svg>',
    night: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>',
    storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 16a4 4 0 0 1 .5-7.9A5 5 0 0 1 17 9a3.5 3.5 0 0 1-.5 7H7Z" fill="currentColor" stroke="none"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2" stroke-linecap="round"/></svg>'
  };
  var DAY_LABEL = { day: 'Ngày 14 · Nắng gắt', night: 'Đêm 14 · Yên tĩnh', storm: 'Ngày 15 · Mưa bão' };
  var SEED_LABEL = { dua: 'Dưa', ngo: 'Ngô', san: 'Sắn' };
  var SEED_ICON = {
    dua: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#4E9F3D"/><path d="M12 4a8 8 0 0 1 0 16" fill="#3d7d30"/></svg>',
    ngo: '<svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="4" fill="#F4D06F"/></svg>',
    san: '<svg viewBox="0 0 24 24"><path d="M12 2c3 4 5 8 5 12a5 5 0 0 1-10 0c0-4 2-8 5-12Z" fill="#C9A06C"/></svg>'
  };

  var app = document.getElementById('app');
  var toastTimer;

  var settingsToggle = document.getElementById('settings-toggle');
  var settingsPanel = document.getElementById('settings-panel');
  settingsToggle.addEventListener('click', function(){
    var willOpen = settingsPanel.hidden;
    settingsPanel.hidden = false;
    requestAnimationFrame(function(){ settingsPanel.classList.toggle('open', willOpen); });
    if(!willOpen) setTimeout(function(){ settingsPanel.hidden = true; }, 150);
  });
  document.addEventListener('click', function(e){
    if(settingsPanel.hidden) return;
    if(!settingsPanel.contains(e.target) && e.target !== settingsToggle && !settingsToggle.contains(e.target)){
      settingsPanel.classList.remove('open');
      setTimeout(function(){ settingsPanel.hidden = true; }, 150);
    }
  });

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  /* ---- Prompt 2: theme switch ---- */
  function setTheme(name){
    app.setAttribute('data-theme', name);
    document.getElementById('hud-weather-dot').innerHTML = WEATHER_ICON[name];
    document.getElementById('hud-day-label').textContent = DAY_LABEL[name];
    document.getElementById('storm-banner').hidden = name !== 'storm';
    document.querySelectorAll('.theme-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-theme-btn') === name);
    });
    var cta = document.getElementById('cta-sail');
    cta.classList.toggle('locked', name === 'storm');
  }
  document.querySelectorAll('.theme-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ setTheme(btn.getAttribute('data-theme-btn')); });
  });
  setTheme('day');

  document.getElementById('cta-sail').addEventListener('click', function(){
    if(app.getAttribute('data-theme') === 'storm'){
      var cta = this;
      cta.classList.remove('shake'); void cta.offsetWidth; cta.classList.add('shake');
      toast('Biển động — chưa thể ra khơi lúc này.');
      return;
    }
    toast('Ra khơi! (demo — chưa nối màn thám hiểm)');
  });

  /* ---- Prompt 3: contextual seed picker (E1) ---- */
  var overlay = document.getElementById('seed-overlay');
  var popup = document.getElementById('seed-popup');
  var arrow = popup.querySelector('.seed-arrow');
  var currentTile = null;

  function openSeedPicker(tileEl){
    currentTile = tileEl;
    var appRect = app.getBoundingClientRect();
    var tileRect = tileEl.getBoundingClientRect();
    var tileCenterX = tileRect.left + tileRect.width / 2 - appRect.left;
    var tileTop = tileRect.top - appRect.top;

    overlay.hidden = false;
    var popupWidth = popup.offsetWidth || 220;
    var half = popupWidth / 2;
    var clampedX = Math.min(Math.max(tileCenterX, half + 8), appRect.width - half - 8);
    popup.style.left = clampedX + 'px';
    popup.style.bottom = (appRect.height - tileTop + 14) + 'px';
    arrow.style.left = 'calc(50% + ' + (tileCenterX - clampedX) + 'px)';

    requestAnimationFrame(function(){ overlay.classList.add('show'); });
  }

  function closeSeedPicker(){
    overlay.classList.remove('show');
    setTimeout(function(){ overlay.hidden = true; }, 180);
    currentTile = null;
  }

  document.querySelectorAll('.plot').forEach(function(tile){
    tile.addEventListener('click', function(){
      if(tile.classList.contains('planted')){
        toast('Đã gieo ' + SEED_LABEL[tile.getAttribute('data-seed')] + ' — chờ ngày thu hoạch.');
        return;
      }
      openSeedPicker(tile);
    });
  });

  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeSeedPicker();
  });
  document.getElementById('seed-close').addEventListener('click', closeSeedPicker);

  document.querySelectorAll('.seed-opt[data-seed]').forEach(function(opt){
    opt.addEventListener('click', function(){
      var seed = opt.getAttribute('data-seed');
      if(currentTile){
        currentTile.classList.add('planted');
        currentTile.setAttribute('data-seed', seed);
        currentTile.innerHTML = SEED_ICON[seed];
      }
      closeSeedPicker();
      toast('Đã gieo ' + SEED_LABEL[seed] + '.');
    });
  });

  /* ---- Prompt 4: daily check-in (F2) ---- */
  var chest = document.getElementById('checkin-chest');
  function openChest(){
    chest.classList.add('opening');
    setTimeout(function(){
      toast('Nhận được: 20 vỏ sò, 5 gỗ trôi dạt.');
    }, 250);
    setTimeout(function(){
      document.getElementById('screen-checkin').hidden = true;
      document.getElementById('screen-homestead').hidden = false;
    }, 650);
  }
  document.getElementById('btn-open-chest').addEventListener('click', openChest);
  chest.addEventListener('click', openChest);

  document.getElementById('btn-replay').addEventListener('click', function(){
    chest.classList.remove('opening');
    document.getElementById('screen-homestead').hidden = true;
    document.getElementById('screen-checkin').hidden = false;
    settingsPanel.classList.remove('open');
    setTimeout(function(){ settingsPanel.hidden = true; }, 150);
  });
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
