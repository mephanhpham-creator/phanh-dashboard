<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phanh's Calendar</title>
<style>
  :root{
    --bg-top:#F4F8EE; --bg-bot:#E3F0DC; --ink:#22331B; --ink-soft:#5B6E52;
    --leaf-dark:#2E5E2E; --leaf:#4C7A3D; --leaf-light:#8FBF6B; --leaf-pale:#C9E4B8;
    --card-bg:#FFFFFF; --line:#DCE8D2;
    --done-grad: linear-gradient(135deg,#8FBF6B,#4C7A3D);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bot) 60%, #D8ECD0 100%);
    color:var(--ink);min-height:100vh;padding:0 0 60px;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px;}

  header{text-align:center;margin-bottom:16px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf-dark);font-weight:700;}
  h1{font-size:26px;margin:6px 0 2px;font-weight:800;}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;}
  .stat-card{background:var(--card-bg);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:0 2px 10px rgba(34,51,27,.06);}
  .stat-value{font-size:20px;font-weight:800;background:var(--done-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .setup{background:#FFF7E6;border:1px solid #E9CE8C;border-radius:14px;padding:14px 16px;font-size:13px;margin-bottom:18px;display:none;}
  .setup.show{display:block;}
  .setup input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd;margin-top:6px;font-size:13px;}
  .setup button{margin-top:10px;background:var(--leaf-dark);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700;}

  .cal-card{background:var(--card-bg);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(34,51,27,.06);}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px;}
  .cal-nav button{background:var(--leaf-pale);border:none;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--leaf-dark);font-weight:700;}
  .cal-nav .month-label{font-weight:800;font-size:15px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{font-size:10px;text-align:center;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
  .cal-day{min-height:88px;border-radius:8px;background:#FAFCF7;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:stretch;
    padding:3px;cursor:pointer;position:relative;font-size:10px;overflow:hidden;}
  .cal-day.empty{background:transparent;border:none;cursor:default;}
  .cal-day.today{border:2px solid var(--leaf);}
  .cal-day.selected{background:var(--leaf-pale);}
  .cal-day .num{font-weight:700;font-size:12px;text-align:right;padding:1px 2px;}
  .cal-day .ev-line{
    font-size:9px;line-height:1.3;padding:1px 3px;margin-top:1px;border-radius:3px;
    background:var(--leaf-pale);color:var(--leaf-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cal-day .ev-line.done{background:transparent;color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--leaf-light);}
  .cal-day .ev-more{font-size:9px;color:var(--ink-soft);padding:1px 3px;}

  .overlay{position:fixed;inset:0;background:rgba(34,51,27,.35);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .sheet{background:var(--card-bg);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:18px 16px 28px;max-height:80vh;overflow-y:auto;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .sheet-head h3{margin:0;font-size:16px;}
  .sheet-close{background:var(--leaf-pale);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--leaf-dark);}
  .item{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--line);}
  .item:last-child{border-bottom:none;}
  .item input[type=checkbox]{appearance:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--leaf-light);
    margin-top:2px;flex:0 0 20px;cursor:pointer;position:relative;background:#fff;}
  .item input[type=checkbox]:checked{background:var(--done-grad);border-color:transparent;}
  .item input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
    border:solid white;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .item-name{font-size:14px;font-weight:600;}
  .item-name.done{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--leaf-light);}
  .item-time{font-size:11px;color:var(--ink-soft);}
  .src-tag{font-size:9px;padding:1px 6px;border-radius:999px;font-weight:700;margin-left:6px;}
  .src-tag.notion{background:var(--leaf-pale);color:var(--leaf-dark);}
  .src-tag.gcal{background:#DCE8F5;color:#3A5A8C;}
  .empty{font-size:13px;color:var(--ink-soft);padding:10px 2px;}

  .status-line{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:14px;}
  .status-line.err{color:#B23A3A;}

  /* ---- Subject folders ---- */
  .folder{border-bottom:1px dashed var(--line);}
  .folder:last-child{border-bottom:none;}
  .folder-head{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;cursor:pointer;}
  .folder-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
  .folder-chevron{font-size:12px;color:var(--leaf);transition:transform .2s;}
  .folder.open .folder-chevron{transform:rotate(90deg);}
  .folder-pct-wrap{display:flex;align-items:center;gap:8px;}
  .folder-count{font-size:12px;color:var(--ink-soft);}
  .folder-bar-track{width:60px;height:6px;border-radius:4px;background:var(--leaf-pale);overflow:hidden;}
  .folder-bar-fill{height:100%;background:var(--done-grad);}
  .folder-body{display:none;padding:0 4px 10px 4px;}
  .folder.open .folder-body{display:block;}
  .subrow{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;font-size:13px;
    background:#FAFCF7;border-radius:8px;margin-top:5px;}
  .subrow-name{color:var(--ink);}
  .subrow-count{font-size:11px;color:var(--ink-soft);font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Live Dashboard</div>
    <h1>Phanh's Calendar</h1>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="statDate">--</div>
      <div class="stat-label">Hôm nay</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statToday">0/0</div>
      <div class="stat-label">Việc hôm nay</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statWeek">0%</div>
      <div class="stat-label">Tiến độ học tập</div>
    </div>
  </div>

  <div class="cal-card" id="foldersCard" style="margin-bottom:16px;">
    <div id="folderList"></div>
  </div>

  <div class="setup" id="setupBox">
    <div><b>Cần kết nối tới Worker trước khi dùng:</b></div>
    <label>Worker URL</label>
    <input id="workerUrl" placeholder="https://...workers.dev">
    <label>Dash Key</label>
    <input id="dashKey" placeholder="dán DASH_KEY vào đây">
    <button onclick="saveConfig()">Lưu &amp; kết nối</button>
  </div>

  <div class="cal-card">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="dowRow"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="status-line" id="statusLine"></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="sheetTitle">Chi tiết ngày</h3>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
let CONFIG = { url:'', key:'' };
let ALL_TASKS = [];
let ALL_EVENTS = [];
let viewYear, viewMonth;
const DOW = ['CN','T2','T3','T4','T5','T6','T7'];

function loadConfig(){
  try{ CONFIG = JSON.parse(sessionStorage.getItem('dashConfig') || '{}'); }catch(e){}
  if(!CONFIG.url || !CONFIG.key){
    document.getElementById('setupBox').classList.add('show');
  } else {
    initCalendar();
  }
}
function saveConfig(){
  CONFIG.url = document.getElementById('workerUrl').value.trim().replace(/\/$/,'');
  CONFIG.key = document.getElementById('dashKey').value.trim();
  sessionStorage.setItem('dashConfig', JSON.stringify(CONFIG));
  document.getElementById('setupBox').classList.remove('show');
  initCalendar();
}
function setStatus(msg, isErr){
  const el = document.getElementById('statusLine');
  el.textContent = msg; el.className = 'status-line' + (isErr?' err':'');
}
async function api(path, opts={}){
  const res = await fetch(CONFIG.url + path, { ...opts, headers:{'Content-Type':'application/json','X-Dash-Key':CONFIG.key, ...(opts.headers||{})} });
  if(!res.ok) throw new Error('API lỗi ' + res.status);
  return res.json();
}

function ymd(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateKey(iso){ return (iso||'').slice(0,10); }

async function initCalendar(){
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth();
  renderDow();
  await loadMonthData();
}
function renderDow(){
  document.getElementById('dowRow').innerHTML = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
}

async function loadMonthData(){
  setStatus('Đang tải dữ liệu...');
  try{
    const { tasks } = await api('/api/tasks');
    ALL_TASKS = tasks;
    try{
      const start = new Date(viewYear, viewMonth, 1);
      const end = new Date(viewYear, viewMonth + 1, 0, 23, 59, 59);
      const { events } = await api('/api/events?start=' + start.toISOString() + '&end=' + end.toISOString());
      ALL_EVENTS = events; // chỉ dùng để lấy giờ hiển thị, KHÔNG dùng để tính done
    }catch(e){ ALL_EVENTS = []; } // Calendar lỗi thì vẫn hiện task Notion bình thường, chỉ thiếu giờ
    renderCalendar();
    renderStats();
    setStatus('Đã tải xong · ' + new Date().toLocaleTimeString('vi-VN'));
  }catch(e){ setStatus('Lỗi tải dữ liệu: ' + e.message, true); }
}

function normalizeName(s){
  return s
    .replace(/^\[[^\]]*\]\s*/,'')
    .replace(/\s*\([^)]*\)\s*$/,'')
    .trim()
    .toLowerCase();
}
function coreMatch(a, b){
  if(!a || !b) return false;
  if(a === b) return true;
  return a.endsWith(b) || b.endsWith(a) || a.includes(' '+b) || b.includes(' '+a);
}
// Tìm giờ hiển thị cho 1 task Notion bằng cách dò tên trùng trong sự kiện Calendar cùng ngày (chỉ để hiển thị)
function findTimeForTask(taskName, dateStr){
  const norm = normalizeName(taskName);
  const dayEvents = ALL_EVENTS.filter(e => dateKey(e.start) === dateStr);
  const match = dayEvents.find(e => coreMatch(normalizeName(e.title.replace(/^✅ /,'')), norm));
  return match ? fmtTime(match.start) : '';
}

function changeMonth(delta){
  viewMonth += delta;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  loadMonthData();
}

function extractTag(name){
  const m = name.match(/^\[([^\]]+)\]/);
  return m ? m[1] : 'Khác';
}

// Mốc nền = 0 vì học lại từ đầu. Số unit hoàn thành mỗi lần tick Done = số ghi RÕ trong tên task
// (vd "– 2 units"); nếu tên task không ghi số cụ thể, mặc định tính là 1 (không đoán thêm).
function parseUnitsFromName(name){
  const m = name.match(/(\d+)\s*units?/i);
  return m ? parseInt(m[1], 10) : 1;
}

const COURSE_CATALOG = {
  IELTS: [
    { label:'Ngữ pháp Cơ Bản Plus', total:38, base:0, match:t=>extractTag(t.name)==='Ngữ pháp' },
    { label:'Từ Vựng Cơ Bản Plus',  total:22, base:0, match:t=>extractTag(t.name)==='Từ vựng' },
    { label:'IELTS Reading Cơ bản', total:10, base:0, match:t=>t.name.toLowerCase().includes('reading') },
    { label:'IELTS Listening Cơ bản', total:9, base:0, match:t=>t.name.toLowerCase().includes('listening') },
    { label:'IELTS Writing Cơ Bản Plus 2', total:26, base:0, match:t=>t.name.toLowerCase().includes('writing') },
    { label:'IELTS Speaking Cơ bản Plus', total:24, base:0, match:t=>t.name.toLowerCase().includes('speaking') },
    { label:'Phát âm Cơ Bản Plus', total:12, base:0, match:t=>t.name.includes('Phát âm') },
  ],
  HSK: [
    { label:'HSK 1 – Nền tảng tiếng Trung', total:28, base:0, match:t=>extractTag(t.name)==='HSK' },
  ],
};
const FOLDER_ORDER = ['IELTS','HSK','AI Agent'];
const AI_AGENT_TOTAL_BUOI = 6;

function buildFolders(){
  const folders = {};

  ['IELTS','HSK'].forEach(folderName => {
    const subs = {};
    let doneSum=0, totalSum=0;
    COURSE_CATALOG[folderName].forEach(c => {
      const doneUnits = ALL_TASKS
        .filter(t => c.match(t) && t.status==='Done')
        .reduce((sum, t) => sum + parseUnitsFromName(t.name), 0);
      const done = Math.min(c.total, c.base + doneUnits);
      subs[c.label] = { done, total:c.total };
      doneSum += done; totalSum += c.total;
    });
    folders[folderName] = { done:doneSum, total:totalSum, subs };
  });

  // AI Agent: cố định 6 buổi, đánh dấu buổi nào đã học dựa trên task "Lớp AI Agent (Buổi N)"
  const doneBuoi = new Set();
  ALL_TASKS.forEach(t => {
    if(extractTag(t.name) !== 'Lớp học') return;
    const m = t.name.match(/Buổi\s*(\d+)/i);
    if(m && t.status==='Done') doneBuoi.add(m[1]);
  });
  const aiSubs = {};
  for(let i=1;i<=AI_AGENT_TOTAL_BUOI;i++){
    aiSubs['Buổi '+i] = { done: doneBuoi.has(String(i)) ? 1 : 0, total:1 };
  }
  folders['AI Agent'] = { done: doneBuoi.size, total: AI_AGENT_TOTAL_BUOI, subs: aiSubs };

  return folders;
}

let OPEN_FOLDERS = new Set();

function renderFolders(){
  const folders = buildFolders();
  const el = document.getElementById('folderList');
  const names = FOLDER_ORDER.filter(n => folders[n]);
  if(!names.length){ el.innerHTML = '<div class="empty">Chưa có dữ liệu môn học.</div>'; return; }

  el.innerHTML = names.map(name => {
    const f = folders[name];
    const pct = f.total ? Math.round(f.done/f.total*100) : 0;
    const isOpen = OPEN_FOLDERS.has(name);
    const subsHtml = Object.entries(f.subs).map(([subName, s]) => `
      <div class="subrow">
        <span class="subrow-name">${subName}</span>
        <span class="subrow-count">${s.done}/${s.total}</span>
      </div>`).join('');
    return `
      <div class="folder ${isOpen?'open':''}" data-folder="${name}">
        <div class="folder-head" onclick="toggleFolder('${name}')">
          <div class="folder-name"><span class="folder-chevron">›</span>${name}</div>
          <div class="folder-pct-wrap">
            <span class="folder-count">${f.done}/${f.total}</span>
            <div class="folder-bar-track"><div class="folder-bar-fill" style="width:${pct}%"></div></div>
          </div>
        </div>
        <div class="folder-body">${subsHtml}</div>
      </div>`;
  }).join('');
}

function toggleFolder(name){
  if(OPEN_FOLDERS.has(name)) OPEN_FOLDERS.delete(name); else OPEN_FOLDERS.add(name);
  renderFolders();
}

function overallLearningPct(){
  const folders = buildFolders();
  let done=0, total=0;
  Object.values(folders).forEach(f => { done+=f.done; total+=f.total; });
  return total ? Math.round(done/total*100) : 0;
}
function normalizeName(s){
  return s
    .replace(/^\[[^\]]*\]\s*/,'')      // bỏ tiền tố dạng [Ngữ pháp], [Kênh]...
    .replace(/\s*\([^)]*\)\s*$/,'')     // bỏ hậu tố giờ giấc dạng (16h-16h30)
    .trim()
    .toLowerCase();
}

function itemsForDay(dateStr){
  return ALL_TASKS
    .filter(x => dateKey(x.due) === dateStr)
    .map(x => ({ id:x.id, name:x.name, done:x.status==='Done', time: findTimeForTask(x.name, dateStr) }))
    .sort((a,b)=> (a.time||'zz').localeCompare(b.time||'zz'));
}
function fmtTime(iso){
  if(!iso) return '';
  if(iso.length <= 10) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
}

function renderCalendar(){
  const months = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  document.getElementById('monthLabel').textContent = months[viewMonth] + ' ' + viewYear;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const todayStr = ymd(new Date());

  for(let i=0;i<firstDow;i++) grid.innerHTML += '<div class="cal-day empty"></div>';

  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(viewYear, viewMonth, d);
    const dateStr = ymd(dateObj);
    const items = itemsForDay(dateStr);
    const isToday = dateStr === todayStr;

    const MAX_SHOW = 3;
    const lines = items.slice(0, MAX_SHOW).map(it =>
      `<div class="ev-line ${it.done?'done':''}">${it.done?'✓ ':''}${it.time?it.time+' ':''}${it.name}</div>`
    ).join('');
    const moreCount = items.length - MAX_SHOW;
    const moreLine = moreCount > 0 ? `<div class="ev-more">+${moreCount} khác</div>` : '';

    const cell = document.createElement('div');
    cell.className = 'cal-day' + (isToday?' today':'');
    cell.dataset.date = dateStr;
    cell.innerHTML = `<span class="num">${d}</span>${lines}${moreLine}`;
    cell.onclick = () => openSheet(dateStr);
    grid.appendChild(cell);
  }
}

function renderStats(){
  const now = new Date();
  const todayStr = ymd(now);
  document.getElementById('statDate').textContent = now.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit' });

  const todayItems = itemsForDay(todayStr);
  const todayDone = todayItems.filter(x=>x.done).length;
  document.getElementById('statToday').textContent = todayDone + '/' + todayItems.length;

  document.getElementById('statWeek').textContent = overallLearningPct() + '%';
  renderFolders();
}

function openSheet(dateStr){
  document.querySelectorAll('.cal-day').forEach(c=>c.classList.toggle('selected', c.dataset.date===dateStr));
  const d = new Date(dateStr + 'T00:00:00');
  document.getElementById('sheetTitle').textContent = 'Chi tiết ' + d.toLocaleDateString('vi-VN', { weekday:'long', day:'2-digit', month:'2-digit' });
  renderSheetBody(dateStr);
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }

function renderSheetBody(dateStr){
  const items = itemsForDay(dateStr);
  const body = document.getElementById('sheetBody');
  if(!items.length){ body.innerHTML = '<div class="empty">Không có việc nào trong ngày này.</div>'; return; }
  body.innerHTML = items.map(it => `
    <div class="item">
      <input type="checkbox" ${it.done?'checked':''} onchange="toggleItem('${it.id}', this.checked, '${dateStr}')">
      <div>
        <div class="item-name ${it.done?'done':''}">${it.name}</div>
        ${it.time?`<div class="item-time">${it.time}</div>`:''}
      </div>
    </div>`).join('');
}

async function toggleItem(id, checked, dateStr){
  setStatus('Đang cập nhật Notion...');
  try{
    await api('/api/tasks/' + id, { method:'PATCH', body: JSON.stringify({ status: checked?'Done':'Not started' }) });
    const t = ALL_TASKS.find(x=>x.id===id); if(t) t.status = checked?'Done':'Not started';
    renderSheetBody(dateStr);
    renderCalendar();
    renderStats();
    setStatus('Đã đồng bộ với Notion ✓');
  }catch(e){ setStatus('Lỗi cập nhật: ' + e.message, true); loadMonthData(); }
}

loadConfig();
</script>
</body>
</html>
