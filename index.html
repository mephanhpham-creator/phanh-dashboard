<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phanh's Calendar</title>
<style>
  :root{
    --bg-top:#F4F8EE; --bg-bot:#E3F0DC; --ink:#22331B; --ink-soft:#5B6E52;
    --leaf-dark:#2E5E2E; --leaf:#4C7A3D; --leaf-light:#8FBF6B; --leaf-pale:#C9E4B8;
    --card-bg:#FFFFFF; --line:#DCE8D2;
    --done-grad: linear-gradient(135deg,#8FBF6B,#4C7A3D);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bot) 60%, #D8ECD0 100%);
    color:var(--ink);min-height:100vh;padding:0 0 60px;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px;}

  header{text-align:center;margin-bottom:16px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf-dark);font-weight:700;}
  h1{font-size:26px;margin:6px 0 2px;font-weight:800;}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;}
  .stat-card{background:var(--card-bg);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:0 2px 10px rgba(34,51,27,.06);}
  .stat-value{font-size:20px;font-weight:800;background:var(--done-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .setup{background:#FFF7E6;border:1px solid #E9CE8C;border-radius:14px;padding:14px 16px;font-size:13px;margin-bottom:18px;display:none;}
  .setup.show{display:block;}
  .setup input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd;margin-top:6px;font-size:13px;}
  .setup button{margin-top:10px;background:var(--leaf-dark);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700;}

  .cal-card{background:var(--card-bg);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(34,51,27,.06);}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px;}
  .cal-nav button{background:var(--leaf-pale);border:none;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--leaf-dark);font-weight:700;}
  .cal-nav .month-label{font-weight:800;font-size:15px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:10px;text-align:center;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
  .cal-day{aspect-ratio:1/1;border-radius:10px;background:#FAFCF7;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:4px 2px;cursor:pointer;position:relative;font-size:12px;}
  .cal-day.empty{background:transparent;border:none;cursor:default;}
  .cal-day.today{border:2px solid var(--leaf);}
  .cal-day.selected{background:var(--leaf-pale);}
  .cal-day .num{font-weight:700;}
  .cal-day .dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--leaf-light);}
  .dot.done{background:var(--leaf-dark);opacity:.45;}
  .cal-day .allDone{position:absolute;top:2px;right:3px;font-size:9px;}

  .overlay{position:fixed;inset:0;background:rgba(34,51,27,.35);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .sheet{background:var(--card-bg);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:18px 16px 28px;max-height:80vh;overflow-y:auto;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .sheet-head h3{margin:0;font-size:16px;}
  .sheet-close{background:var(--leaf-pale);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--leaf-dark);}
  .item{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--line);}
  .item:last-child{border-bottom:none;}
  .item input[type=checkbox]{appearance:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--leaf-light);
    margin-top:2px;flex:0 0 20px;cursor:pointer;position:relative;background:#fff;}
  .item input[type=checkbox]:checked{background:var(--done-grad);border-color:transparent;}
  .item input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
    border:solid white;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .item-name{font-size:14px;font-weight:600;}
  .item-name.done{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--leaf-light);}
  .item-time{font-size:11px;color:var(--ink-soft);}
  .src-tag{font-size:9px;padding:1px 6px;border-radius:999px;font-weight:700;margin-left:6px;}
  .src-tag.notion{background:var(--leaf-pale);color:var(--leaf-dark);}
  .src-tag.gcal{background:#DCE8F5;color:#3A5A8C;}
  .empty{font-size:13px;color:var(--ink-soft);padding:10px 2px;}

  .status-line{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:14px;}
  .status-line.err{color:#B23A3A;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Live Dashboard</div>
    <h1>Phanh's Calendar</h1>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="statDate">--</div>
      <div class="stat-label">Hôm nay</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statToday">0/0</div>
      <div class="stat-label">Việc hôm nay</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statWeek">0%</div>
      <div class="stat-label">Tiến độ tuần</div>
    </div>
  </div>

  <div class="setup" id="setupBox">
    <div><b>Cần kết nối tới Worker trước khi dùng:</b></div>
    <label>Worker URL</label>
    <input id="workerUrl" placeholder="https://...workers.dev">
    <label>Dash Key</label>
    <input id="dashKey" placeholder="dán DASH_KEY vào đây">
    <button onclick="saveConfig()">Lưu &amp; kết nối</button>
  </div>

  <div class="cal-card">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="dowRow"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="status-line" id="statusLine"></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="sheetTitle">Chi tiết ngày</h3>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
let CONFIG = { url:'', key:'' };
let ALL_TASKS = [];
let ALL_EVENTS = [];
let viewYear, viewMonth;
const DOW = ['CN','T2','T3','T4','T5','T6','T7'];

function loadConfig(){
  try{ CONFIG = JSON.parse(sessionStorage.getItem('dashConfig') || '{}'); }catch(e){}
  if(!CONFIG.url || !CONFIG.key){
    document.getElementById('setupBox').classList.add('show');
  } else {
    initCalendar();
  }
}
function saveConfig(){
  CONFIG.url = document.getElementById('workerUrl').value.trim().replace(/\/$/,'');
  CONFIG.key = document.getElementById('dashKey').value.trim();
  sessionStorage.setItem('dashConfig', JSON.stringify(CONFIG));
  document.getElementById('setupBox').classList.remove('show');
  initCalendar();
}
function setStatus(msg, isErr){
  const el = document.getElementById('statusLine');
  el.textContent = msg; el.className = 'status-line' + (isErr?' err':'');
}
async function api(path, opts={}){
  const res = await fetch(CONFIG.url + path, { ...opts, headers:{'Content-Type':'application/json','X-Dash-Key':CONFIG.key, ...(opts.headers||{})} });
  if(!res.ok) throw new Error('API lỗi ' + res.status);
  return res.json();
}

function ymd(d){ return d.toISOString().slice(0,10); }
function dateKey(iso){ return (iso||'').slice(0,10); }

async function initCalendar(){
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth();
  renderDow();
  await loadMonthData();
}
function renderDow(){
  document.getElementById('dowRow').innerHTML = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
}

async function loadMonthData(){
  setStatus('Đang tải dữ liệu...');
  try{
    const { tasks } = await api('/api/tasks');
    ALL_TASKS = tasks;
    const start = new Date(viewYear, viewMonth, 1);
    const end = new Date(viewYear, viewMonth + 1, 0, 23, 59, 59);
    const { events } = await api('/api/events?start=' + start.toISOString() + '&end=' + end.toISOString());
    ALL_EVENTS = events;
    renderCalendar();
    renderStats();
    setStatus('Đã tải xong · ' + new Date().toLocaleTimeString('vi-VN'));
  }catch(e){ setStatus('Lỗi tải dữ liệu: ' + e.message, true); }
}

function changeMonth(delta){
  viewMonth += delta;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  loadMonthData();
}

function normalizeName(s){
  return s
    .replace(/^\[[^\]]*\]\s*/,'')      // bỏ tiền tố dạng [Ngữ pháp], [Kênh]...
    .replace(/\s*\([^)]*\)\s*$/,'')     // bỏ hậu tố giờ giấc dạng (16h-16h30)
    .trim()
    .toLowerCase();
}

function itemsForDay(dateStr){
  const tasks = ALL_TASKS.filter(x => dateKey(x.due) === dateStr);
  const events = ALL_EVENTS.filter(x => dateKey(x.start) === dateStr);

  const usedEventIds = new Set();
  const merged = [];

  tasks.forEach(t => {
    const norm = normalizeName(t.name);
    const match = events.find(e => !usedEventIds.has(e.id) && normalizeName(e.title.replace(/^✅ /,'')) === norm);
    if(match){
      usedEventIds.add(match.id);
      merged.push({
        id: t.id, eventId: match.id,
        name: match.title.replace(/^✅ /,''),
        done: (t.status==='Done') || match.done,
        time: fmtTime(match.start),
        source: 'both'
      });
    } else {
      merged.push({ id:t.id, name:t.name, done:t.status==='Done', time:'', source:'notion' });
    }
  });

  events.filter(e => !usedEventIds.has(e.id)).forEach(e => {
    merged.push({ id:e.id, name:e.title.replace(/^✅ /,''), done:e.done, time:fmtTime(e.start), source:'gcal' });
  });

  return merged.sort((a,b)=> (a.time||'').localeCompare(b.time||''));
}
function fmtTime(iso){
  if(!iso) return '';
  if(iso.length <= 10) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
}

function renderCalendar(){
  const months = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  document.getElementById('monthLabel').textContent = months[viewMonth] + ' ' + viewYear;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const todayStr = ymd(new Date());

  for(let i=0;i<firstDow;i++) grid.innerHTML += '<div class="cal-day empty"></div>';

  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(viewYear, viewMonth, d);
    const dateStr = ymd(dateObj);
    const items = itemsForDay(dateStr);
    const doneCount = items.filter(x=>x.done).length;
    const isToday = dateStr === todayStr;
    const allDone = items.length>0 && doneCount===items.length;
    const dots = items.slice(0,5).map(x=>`<span class="dot ${x.done?'done':''}"></span>`).join('');

    const cell = document.createElement('div');
    cell.className = 'cal-day' + (isToday?' today':'');
    cell.dataset.date = dateStr;
    cell.innerHTML = `<span class="num">${d}</span><div class="dots">${dots}</div>${allDone?'<span class="allDone">✅</span>':''}`;
    cell.onclick = () => openSheet(dateStr);
    grid.appendChild(cell);
  }
}

function renderStats(){
  const now = new Date();
  const todayStr = ymd(now);
  document.getElementById('statDate').textContent = now.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit' });

  const todayItems = itemsForDay(todayStr);
  const todayDone = todayItems.filter(x=>x.done).length;
  document.getElementById('statToday').textContent = todayDone + '/' + todayItems.length;

  const dow = now.getDay();
  const diffToMon = dow===0 ? -6 : 1-dow;
  const monday = new Date(now); monday.setDate(now.getDate()+diffToMon); monday.setHours(0,0,0,0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);

  let weekTotal=0, weekDone=0;
  for(let d=new Date(monday); d<=sunday; d.setDate(d.getDate()+1)){
    const items = itemsForDay(ymd(d));
    weekTotal += items.length;
    weekDone += items.filter(x=>x.done).length;
  }
  const pct = weekTotal ? Math.round(weekDone/weekTotal*100) : 0;
  document.getElementById('statWeek').textContent = pct + '%';
}

function openSheet(dateStr){
  document.querySelectorAll('.cal-day').forEach(c=>c.classList.toggle('selected', c.dataset.date===dateStr));
  const d = new Date(dateStr + 'T00:00:00');
  document.getElementById('sheetTitle').textContent = 'Chi tiết ' + d.toLocaleDateString('vi-VN', { weekday:'long', day:'2-digit', month:'2-digit' });
  renderSheetBody(dateStr);
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }

function renderSheetBody(dateStr){
  const items = itemsForDay(dateStr);
  const body = document.getElementById('sheetBody');
  if(!items.length){ body.innerHTML = '<div class="empty">Không có việc nào trong ngày này.</div>'; return; }
  body.innerHTML = items.map(it => {
    const tag = it.source==='notion' ? '<span class="src-tag notion">Notion</span>'
      : it.source==='gcal' ? '<span class="src-tag gcal">Calendar</span>'
      : '<span class="src-tag notion">Notion</span><span class="src-tag gcal">Calendar</span>';
    return `
    <div class="item">
      <input type="checkbox" ${it.done?'checked':''} onchange="toggleItem('${it.source}','${it.id}', this.checked, '${dateStr}', '${it.eventId||''}')">
      <div>
        <div class="item-name ${it.done?'done':''}">${it.name}${tag}</div>
        <div class="item-time">${it.time}</div>
      </div>
    </div>`;
  }).join('');
}

async function toggleItem(source, id, checked, dateStr, eventId){
  setStatus('Đang đồng bộ...');
  try{
    if(source === 'notion' || source === 'both'){
      await api('/api/tasks/' + id, { method:'PATCH', body: JSON.stringify({ status: checked?'Done':'Not started' }) });
      const t = ALL_TASKS.find(x=>x.id===id); if(t) t.status = checked?'Done':'Not started';
    }
    if(source === 'gcal' || source === 'both'){
      const targetId = source==='both' ? eventId : id;
      await api('/api/events/' + targetId, { method:'PATCH', body: JSON.stringify({ done: checked }) });
      const e = ALL_EVENTS.find(x=>x.id===targetId); if(e) e.done = checked;
    }
    renderSheetBody(dateStr);
    renderCalendar();
    renderStats();
    setStatus('Đã đồng bộ ✓');
  }catch(e){ setStatus('Lỗi đồng bộ: ' + e.message, true); loadMonthData(); }
}

loadConfig();
</script>
</body>
</html>
